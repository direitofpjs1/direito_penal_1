function stats(){let o=overall();return `<div class="hero"><span class="eyebrow">PAINEL DE ACOMPANHAMENTO</span><h1>Seu desempenho</h1><p class="lead">Acompanhamento local e individual dos julgamentos realizados em cada assunto.</p><div class="meta"><span class="chip">${o.done}/${o.total} respondidas</span><span class="chip">${o.pct}% de conclusão</span></div></div><div class="panel">${M.map((m,mi)=>`<h2>${m.icon} ${esc(m.name)}</h2>${m.topics.map((t,ti)=>{let g=grade(mi,ti);return `<div style="margin:20px 0"><div class="sticky-top"><button class="secondary" onclick="go(${mi},${ti})">${esc(t.name)}</button><span class="sub">${g.correct} acertos · ${g.done}/${g.total} respondidas</span></div><div class="progress"><div class="bar" style="width:${100*g.done/g.total}%"></div></div></div>`}).join('')}`).join('')}</div><div class="panel"><h2>Gestão do progresso</h2><p class="muted">Os dados ficam somente neste navegador. A navegação privada ou limpeza do armazenamento podem apagá-los.</p><button class="secondary" onclick="if(confirm('Apagar todo o progresso?')){Object.keys(answers).forEach(k=>delete answers[k]);Object.keys(fixed).forEach(k=>delete fixed[k]);save();go(-3,-3)}">Zerar todo o progresso</button></div>`}
document.getElementById('menubtn').onclick=()=>document.getElementById('side').classList.toggle('open');go(-1,-1);
const BONUS_DATA={"t1":{"title":"Ilicitude e causas justificantes","questions":[{"id":1,"question":"Quanto à relação entre o fato típico e a ilicitude, qual é a teoria adotada pelo ordenamento jurídico-penal brasileiro?","options":["Teoria da absoluta independência (Beling), para a qual não há nenhuma relação entre tipicidade e ilicitude.","Teoria da indiciariedade ou 'ratio cognoscendi' (Mayer), segundo a qual o fato típico gera uma presunção relativa de ilicitude.","Teoria dos elementos negativos do tipo, que trata as excludentes como elementos expressos do preceito primário.","Teoria da absoluta dependência (Mezger), que funde tipicidade e ilicitude no tipo total do injusto."],"correct":1,"explanation":"O Brasil adota a Teoria da Indiciariedade (ratio cognoscendi), idealizada por Mayer em 1915: a prática de um fato típico gera a presunção relativa de que ele é também ilícito, cabendo à defesa comprovar a presença de excludente de ilicitude."},{"id":2,"question":"Sobre o Estado de Necessidade no Código Penal brasileiro (art. 24), qual teoria foi expressamente acolhida quanto ao valor dos bens em conflito?","options":["Teoria Diferenciadora, admitindo tanto o estado de necessidade justificante quanto o exculpante.","Teoria Subjetiva Pura, analisando apenas a periculosidade do causador do perigo.","Teoria Unitária, considerando o estado de necessidade exclusivamente como excludente da ilicitude (justificante).","Teoria Mista Alemã, que exclui a punibilidade quando o bem sacrificado é mais valioso."],"correct":2,"explanation":"O Código Penal comum disciplina o estado de necessidade como justificante (art. 24). O § 2º prevê que, quando era razoável exigir o sacrifício do direito ameaçado, a pena poderá ser reduzida de um a dois terços. A redução não é automática; também existem formulações diferenciadoras em outros regimes e na doutrina."},{"id":3,"question":"Em matéria de legítima defesa, como a doutrina diferencia o dever de fuga ('commodus discessus') em comparação ao estado de necessidade?","options":["A legítima defesa exige expressamente a fuga do local sempre que houver rota de escape segura.","No estado de necessidade o perigo é lícito repelir à força sem necessidade de fuga; na legítima defesa a fuga é obrigatória.","Na legítima defesa a injustiça da agressão justifica a reação proporcional do agredido, não se impondo a exigência de fuga ('commodus discessus').","Ambos os institutos equiparam-se na exigência imperativa de fuga antes do emprego de qualquer meio violento."],"correct":2,"explanation":"Diferentemente do estado de necessidade (onde a lesão deve ser o único modo inevitável de afastar o perigo), na legítima defesa o agredido não é obrigado a fugir ('commodus discessus'), pois a agressão é injusta e autoriza a reação moderada com os meios necessários."},{"id":4,"question":"Qual é a natureza jurídica do uso de 'ofendículos' (ex.: cacos de vidro no muro ou cercas elétricas) segundo a doutrina majoritária?","options":["Constitui sempre crime de perigo comum abstrato por expor transeuntes a risco indevido.","Exercício regular de direito enquanto não acionado; e legítima defesa preordenada no momento em que é acionado para repelir a agressão.","Causa supralegal de exclusão de culpabilidade por inexigibilidade de conduta diversa.","Estado de necessidade putativo decorrente de perigo potencial futuro."],"correct":1,"explanation":"Uma formulação doutrinária conhecida qualifica a instalação regular de ofendículos como exercício regular de direito e sua reação a uma invasão como legítima defesa preordenada. A qualificação não é automática: instalação, necessidade, moderação, advertência e riscos a terceiros devem ser avaliados no caso concreto."},{"id":5,"question":"O que caracteriza o chamado 'excesso exculpante' nas causas de justificação?","options":["Ultrapassagem consciente e premeditada dos limites da excludente para executar vingança privada.","Extrapolação dos limites decorrente de caso fortuito ou evento imprevisível.","Ultrapassagem dos limites da legítima defesa em razão de perturbação anímica que retira a capacidade de agir com moderação, afastando a culpabilidade.","Erro inescusável sobre elementar fática do tipo permissivo."],"correct":2,"explanation":"O chamado excesso exculpante é uma construção doutrinária ligada a estados emocionais extremos que tornariam inexigível uma conduta diversa. Não é uma excludente geral expressamente enumerada no art. 23 do CP, nem decorre automaticamente de medo ou perturbação."}]},"t2":{"title":"Culpabilidade","questions":[{"id":1,"question":"Com base na Teoria Normativa Pura (adotada em sua vertente Limitada pelo Código Penal), quais são os três elementos integrantes da culpabilidade?","options":["Dolo, culpa e imputabilidade.","Imputabilidade, exigibilidade de conduta diversa e dolo normativo.","Imputabilidade, potencial consciência da ilicitude e exigibilidade de conduta diversa.","Tipicidade conglobante, antinormatividade e imputabilidade."],"correct":2,"explanation":"Com a migração do dolo e da culpa para a conduta (fato típico) operada pelo Finalismo de Welzel, a culpabilidade passou a ser estritamente normativa, constituída por: Imputabilidade, Potencial Consciência da Ilicitude e Exigibilidade de Conduta Diversa."},{"id":2,"question":"A embriaguez voluntária ou culposa (não acidental), ainda que completa, não exclui a imputabilidade penal. Qual teoria fundamenta essa regra no CP?","options":["Teoria da Causalidade Adequada.","Teoria da 'Actio Libera in Causa' (ação livre na causa).","Teoria da Imputação Objetiva.","Teoria da Equivalência dos Antecedentes."],"correct":1,"explanation":"O art. 28, II, do CP estabelece que embriaguez voluntária ou culposa não exclui a imputabilidade. A actio libera in causa é uma fundamentação doutrinária histórica; sua aplicação deve respeitar a imputação subjetiva e não autoriza responsabilidade penal objetiva."},{"id":3,"question":"Como o art. 21 do CP disciplina os efeitos jurídicos do erro de proibição inevitável (escusável) e evitável (inescusável)?","options":["O inevitável exclui o dolo; o evitável autoriza a punição por crime culposo.","Ambos isentam de pena, aplicando-se apenas medidas de segurança.","O inevitável isenta o agente de pena; o evitável mantém a condenação, mas reduz a pena de 1/6 a 1/3.","O erro de proibição jamais produz efeitos penais benéficos, pois o desconhecimento da lei é inescusável."],"correct":2,"explanation":"O erro sobre a ilicitude do fato (erro de proibição), quando inevitável (escusável), isenta o agente de pena (exclui a culpabilidade); quando evitável (inescusável), não impede a condenação, mas reduz a pena de 1/6 a 1/3."},{"id":4,"question":"Qual é a distinção estrutural entre a coação física irresistível ('vis absoluta') e a coação moral irresistível ('vis compulsiva')?","options":["A coação física exclui a culpabilidade; a coação moral exclui a tipicidade.","A coação física exclui a conduta (fato típico); a coação moral irresistível afasta a culpabilidade (inexigibilidade de conduta diversa).","Ambas excluem a ilicitude por caracterizarem estado de necessidade de terceiro.","A coação moral só beneficia o coacto se este for menor de 21 anos."],"correct":1,"explanation":"Na coação física absoluta não há voluntariedade corporal, inexistindo conduta (o fato é atípico); na coação moral irresistível há conduta com vontade viciada sob ameaça grave, afastando-se a culpabilidade por inexigibilidade de conduta diversa."},{"id":5,"question":"De acordo com as fontes, qual é o enquadramento dogmático da Teoria da Coculpabilidade (Zaffaroni) no Código Penal brasileiro?","options":["Constitui causa obrigatória de exclusão da tipicidade formal.","Pode ser aplicada pelo magistrado na individualização da pena como atenuante genérica inominada (art. 66 do CP).","Trata-se de hipótese expressa de descriminante putativa.","É vedada em absoluto por violar o princípio da legalidade estrita."],"correct":1,"explanation":"A coculpabilidade, relacionada à reflexão de Zaffaroni sobre desigualdade estrutural, não é prevista expressamente como atenuante. Sua consideração pelo art. 66 é uma possibilidade doutrinária discutida, condicionada à fundamentação do caso concreto; não é reconhecimento automático."}]},"t3":{"title":"Iter criminis, tentativa e crime impossível","questions":[{"id":1,"question":"Em relação à punição da tentativa no Código Penal brasileiro (art. 14, II e parágrafo único), qual teoria é adotada como regra geral?","options":["Teoria Subjetiva ou Voluntarística, punindo a tentativa com a mesma pena do crime consumado.","Teoria Objetiva (Realística), punindo a tentativa com a pena do crime consumado diminuída de 1/3 a 2/3.","Teoria Sintomática, aplicando punição com base exclusiva no diagnóstico de periculosidade.","Teoria da Tipicidade Absoluta, considerando a tentativa fato atípico punível apenas em contravenções."],"correct":1,"explanation":"O CP adota a Teoria Objetiva (Realística): como o resultado objetivo não se aperfeiçoou, pune-se a tentativa com a pena do crime consumado reduzida de um a dois terços, salvo em crimes de atentado (onde o tipo pune expressamente o tentar consumar com pena idêntica)."},{"id":2,"question":"Qual é a natureza jurídica da Desistência Voluntária e do Arrependimento Eficaz ('Ponte de Ouro' - art. 15 do CP)?","options":["Causas de extinção da punibilidade que aproveitam exclusivamente ao autor imediato.","Causas de exclusão da culpabilidade por inexigibilidade de conduta diversa.","Causas de exclusão da tipicidade em relação ao crime inicialmente almejado, respondendo o agente pelos atos já praticados.","Causas gerais de diminuição de pena aplicadas na terceira fase da dosimetria."],"correct":2,"explanation":"Segundo a doutrina majoritária, a desistência voluntária e o arrependimento eficaz operam a exclusão da tipicidade circunstancial da tentativa, fazendo com que o agente responda apenas pelos atos até então executados que constituam delito autônomo."},{"id":3,"question":"Quais são os requisitos indispensáveis para a incidência do Arrependimento Posterior ('Ponte de Prata' - art. 16 do CP)?","options":["Crime cometido sem violência ou grave ameaça à pessoa, reparação do dano ou restituição voluntária da coisa até o recebimento da denúncia ou queixa.","Crime culposo de trânsito com composição pecuniária até a sentença penal condenatória.","Qualquer crime patrimonial, ainda que com violência física, desde que confessado na fase policial.","Reparação parcial ou integral do dano ocorrida antes do trânsito em julgado da condenação."],"correct":0,"explanation":"O art. 16 do CP exige cumulativamente: crime sem violência ou grave ameaça à pessoa, ato voluntário de restituição ou reparação integral do dano e implemento temporal prévio ao recebimento da peça acusatória (denúncia ou queixa)."},{"id":4,"question":"Quanto ao Crime Impossível (art. 17 do CP), qual teoria o legislador brasileiro consagrou para afastar a punição?","options":["Teoria Sintomática da Periculosidade.","Teoria Objetiva Pura, exigindo apenas inidoneidade relativa dos meios.","Teoria Objetiva Temperada (Intermediária), exigindo que a ineficácia do meio ou a impropriedade do objeto seja absoluta.","Teoria Subjetiva Integral."],"correct":2,"explanation":"O Código Penal adotou a Teoria Objetiva Temperada: a tentativa só é impunível quando a ineficácia dos meios ou a impropriedade do objeto material sobre o qual recai a conduta for absoluta; se for relativa, haverá tentativa punível."},{"id":5,"question":"Dá-se o nome de tentativa incruenta (ou branca) àquela em que:","options":["O agente não consegue praticar todos os atos executórios planejados.","A vítima não sofre lesão física ou dano corporal efetivo.","O resultado é alcançado por meio de dolo eventual.","Ocorre a absolvição imprópria por inimputabilidade superveniente."],"correct":1,"explanation":"Tentativa incruenta (ou branca) é aquela em que o meio de execução é empregado, mas a vítima não é fisicamente atingida (nenhuma lesão é produzida), em contraposição à tentativa cruenta (ou vermelha), onde a vítima é ferida."}]},"t4":{"title":"Concurso de pessoas","questions":[{"id":1,"question":"Qual é a teoria acolhida pelo Código Penal brasileiro como regra geral para a punição no concurso de pessoas (art. 29, caput)?","options":["Teoria Pluralista, atribuindo a cada concorrente um crime autônomo.","Teoria Dualista, que prevê um crime para os executores e outro para os partícipes.","Teoria Monista (Unitária ou Igualitária), pela qual todos os que concorrem para a prática delitiva respondem pelo mesmo crime, na medida de sua culpabilidade.","Teoria da Culpabilidade Fragmentada."],"correct":2,"explanation":"O art. 29 do CP adota a Teoria Monista (ou Unitária): todos os concorrentes incidem nas penas cominadas a um único e mesmo crime, embora as reprimendas sejam individualizadas na medida da culpabilidade de cada agente."},{"id":2,"question":"Conforme a Teoria do Domínio do Fato (Claus Roxin), quem assume juridicamente a condição de autor imediato?","options":["Apenas aquele que fornece os instrumentos materiais para a fuga.","Aquele que realiza por suas próprias mãos a conduta típica (domínio da ação).","Qualquer indivíduo que instigue moralmente uma conduta de terceiros.","O agente que atua exclusivamente em estado de obediência hierárquica."],"correct":1,"explanation":"Na teoria do domínio do fato, o autor imediato executa a conduta por suas próprias mãos (domínio da ação). Domínio da vontade e domínio funcional explicam outras modalidades de autoria, sem transformar automaticamente todo dirigente ou planejador em autor imediato."},{"id":3,"question":"Dois atiradores, sem liame subjetivo entre si e escondidos em pontos opostos, disparam simultaneamente contra a mesma vítima. A perícia aponta que um único tiro foi letal, mas não consegue identificar de qual arma partiu. Como se resolve a responsabilidade penal?","options":["Ambos respondem por homicídio consumado em virtude da causalidade objetiva.","Trata-se de autoria colateral incerta: em homenagem ao princípio do 'in dubio pro reo', ambos respondem por tentativa de homicídio.","Ambos são absolvidos sumariamente pela atipicidade da autoria incerta.","A responsabilidade recai exclusivamente sobre quem efetuou o primeiro disparo."],"correct":1,"explanation":"Trata-se de autoria colateral com autoria incerta. Como ambos agiram com dolo de matar, mas não tinham liame subjetivo e a perícia não determinou quem produziu o tiro letal, o 'in dubio pro reo' impõe que ambos respondam por tentativa de homicídio."},{"id":4,"question":"De acordo com o art. 30 do Código Penal, qual é a regra de comunicabilidade entre coautores e partícipes?","options":["Todas as condições pessoais comunicam-se obrigatoriamente.","Não se comunicam as circunstâncias e as condições de caráter pessoal, salvo quando elementares do crime.","Circunstâncias objetivas jamais se comunicam aos partícipes.","As elementares do tipo somente se comunicam aos partícipes materiais, nunca aos partícipes morais."],"correct":1,"explanation":"O art. 30 do CP estabelece: não se comunicam as circunstâncias e as condições de caráter pessoal (subjetivas), salvo quando forem elementares constitutivas do próprio tipo penal (ex.: a condição de funcionário público no peculato comunica-se ao coautor particular que a conhece)."},{"id":5,"question":"Qual é a teoria da acessoriedade adotada majoritariamente no Brasil para justificar a punição da participação?","options":["Acessoriedade Mínima (basta o autor praticar fato típico).","Acessoriedade Limitada ou Média (o autor deve ter praticado fato típico e ilícito).","Acessoriedade Máxima (exige que o fato seja típico, ilícito e o autor seja culpável).","Hiperacessoriedade (exige fato típico, ilícito, culpável e punível)."],"correct":1,"explanation":"Predomina a Teoria da Acessoriedade Limitada: para que o partícipe seja punível, basta que o autor principal tenha executado uma conduta típica e ilícita (injusto penal), sendo irrelevante se o autor possui ou não culpabilidade (ex.: partícipe de crime cometido por inimputável responde pelo delito)."}]}};
const BONUS_NAMES=['Ilicitude','Culpabilidade','Iter criminis','Concurso de pessoas'];
let bonusActive=0;
let bonusAnswers={};
try{bonusAnswers=JSON.parse(localStorage.getItem('penal_bonus_nlm_v1')||'{}')||{}}catch(e){bonusAnswers={}}
function saveBonus(){try{localStorage.setItem('penal_bonus_nlm_v1',JSON.stringify(bonusAnswers))}catch(e){}}
const VIDEO_FILES=['videos/ilicitude.mp4','videos/culpabilidade.mp4','videos/iter-criminis.mp4','videos/concurso-pessoas.mp4'];
const VIDEO_LABELS=['ilicitude.mp4','culpabilidade.mp4','iter-criminis.mp4','concurso-pessoas.mp4'];
const selectedVideoFiles={};
function videoError(video){
  const card=video.closest('.video-panel');if(!card)return;
  const msg=card.querySelector('.video-alert');if(!msg)return;
  if(video.error && video.error.code===4){
    msg.innerHTML='<b>Vídeo não encontrado ou formato não reconhecido.</b> Verifique se o arquivo MP4 está na pasta <code>videos/</code>, ao lado de <code>index.html</code>, e com o nome exato indicado. Você também pode selecioná-lo manualmente abaixo.';
  }else{
    msg.innerHTML='<b>Não foi possível carregar o vídeo.</b> Confirme a estrutura de pastas e tente selecionar o MP4 manualmente.';
  }
  msg.hidden=false;
}
function loadVideoFile(input,mi){
  const file=input.files&&input.files[0];if(!file)return;
  if(!file.type.startsWith('video/') && !/\.mp4$/i.test(file.name)){alert('Selecione um arquivo de vídeo MP4.');return;}
  if(selectedVideoFiles[mi])URL.revokeObjectURL(selectedVideoFiles[mi]);
  selectedVideoFiles[mi]=URL.createObjectURL(file);
  const card=input.closest('.video-panel');const video=card.querySelector('video');
  const alertEl=card.querySelector('.video-alert');alertEl.hidden=true;
  video.src=selectedVideoFiles[mi];video.load();
  video.play().catch(()=>{});
}
function videoCard(mi,isModule){
 let source=selectedVideoFiles[mi]||VIDEO_FILES[mi],title=BONUS_NAMES[mi],filename=VIDEO_LABELS[mi];
 return `<section class="panel video-panel" aria-label="Resumo audiovisual de ${esc(title)}"><span class="eyebrow">${isModule?'RESUMO AUDIOVISUAL DO EIXO':'01 · INTRODUÇÃO AUDIOVISUAL'} · VIDEOAULA</span><div class="video-shell"><div class="video-player-header"><div class="video-symbol" aria-hidden="true">▶</div><div><h3>Revisão em vídeo · ${esc(title)}</h3><p>${isModule?'Assista à visão geral antes de selecionar um assunto.':'Assista à introdução e avance para o resumo, os conceitos e o simulado.'}</p></div></div><video controls playsinline preload="metadata" src="${source}" onerror="videoError(this)" onloadedmetadata="this.closest('.video-panel').querySelector('.video-alert').hidden=true" aria-label="Vídeo-resumo: ${esc(title)}">Seu navegador não suporta reprodução MP4.</video><div class="video-alert" role="alert" hidden></div><div class="video-player-footer"><span class="vidnote">Arquivo esperado: <strong>videos/${filename}</strong> · Reprodução offline com a pasta completa</span><label class="video-file-button">Selecionar MP4<input class="video-file-input" type="file" accept="video/mp4,.mp4" onchange="loadVideoFile(this,${mi})"></label></div></div></section>`;
}
function bonusStats(k){let questions=BONUS_DATA[k].questions;let done=0,correct=0;questions.forEach(q=>{let v=bonusAnswers[k+':'+q.id];if(v!==undefined){done++;if(v===q.correct)correct++}});return {done,correct,total:questions.length}}
function bonusView(){let k='t'+(bonusActive+1),test=BONUS_DATA[k],g=bonusStats(k),all=Object.keys(BONUS_DATA).map(bonusStats),tot=all.reduce((x,y)=>({done:x.done+y.done,correct:x.correct+y.correct,total:x.total+y.total}),{done:0,correct:0,total:0});return `<section class="hero"><span class="eyebrow">ETAPA COMPLEMENTAR · FINAL DO CURSO</span><h1>Questões bônus</h1><p class="lead">20 questões adicionais de múltipla escolha, organizadas por eixo. Responda e receba imediatamente o gabarito e o comentário. As questões regulares permanecem inalteradas.</p><div class="meta"><span class="chip">${tot.done}/${tot.total} respondidas</span><span class="chip">${tot.correct} acertos</span><span class="chip">${tot.done?Math.round(tot.correct/tot.done*100):0}% de aproveitamento das respondidas</span></div></section><section class="panel"><div class="sticky-top"><div><span class="eyebrow">SELECIONE UM EIXO</span><h2>Simulado complementar</h2></div></div><div class="bonus-tabs" role="group" aria-label="Eixos do simulado bônus">${BONUS_NAMES.map((n,i)=>`<button class="bonus-tab ${bonusActive===i?'selected':''}" aria-pressed="${bonusActive===i}" onclick="setBonusTab(${i})">${esc(n)}</button>`).join('')}</div><div class="bonus-stat"><span><strong>${g.done}/${g.total}</strong> respondidas</span><span><strong>${g.correct}</strong> acertos</span><span><strong>${g.done?Math.round(g.correct/g.done*100):0}%</strong> aproveitamento</span></div><div class="progress"><div class="bar" style="width:${100*g.done/g.total}%"></div></div><p class="muted">Escolha uma alternativa. A resposta será registrada com feedback imediato, inclusive quando incorreta.</p>${test.questions.map((q,i)=>bonusQuestion(k,q,i)).join('')}<div class="bottomnav"><button class="secondary" onclick="resetBonus('${k}')">Refazer este conjunto</button>${bonusActive<3?`<button class="primary" onclick="setBonusTab(${bonusActive+1})">Próximo eixo →</button>`:`<button class="primary" onclick="go(-3,-3)">Ver desempenho →</button>`}</div></section>`}
function bonusQuestion(k,q,i){let v=bonusAnswers[k+':'+q.id],done=v!==undefined,good=done&&v===q.correct;return `<article class="bonus-card" id="bq-${k}-${q.id}"><div class="qnum">QUESTÃO BÔNUS ${String(i+1).padStart(2,'0')} DE 05 · ${esc(BONUS_DATA[k].title)}</div><h3>${esc(q.question)}</h3><div class="bonus-options">${q.options.map((o,j)=>`<button class="bonus-option ${done?(j===q.correct?'correct':j===v?'wrong':''):''}" ${done?'disabled':''} onclick="answerBonus('${k}',${q.id},${j})"><strong>${String.fromCharCode(65+j)}.</strong> ${esc(o)}</button>`).join('')}</div>${done?`<div class="feedback ${good?'good':'bad'}" role="status"><strong>${good?'✓ Resposta correta':'✕ Resposta incorreta'} · Gabarito: ${String.fromCharCode(65+q.correct)}</strong><div>${esc(q.explanation)}</div></div>`:''}</article>`}
function answerBonus(k,id,value){let key=k+':'+id;if(bonusAnswers[key]!==undefined)return;bonusAnswers[key]=value;saveBonus();let oldTop=document.getElementById('bq-'+k+'-'+id).getBoundingClientRect().top;document.getElementById('main').innerHTML=bonusView();let newTop=document.getElementById('bq-'+k+'-'+id).getBoundingClientRect().top;window.scrollBy(0,newTop-oldTop)}
function setBonusTab(i){bonusActive=i;go(-4,-4)}
function resetBonus(k){if(!confirm('Apagar as respostas deste conjunto bônus?'))return;BONUS_DATA[k].questions.forEach(q=>delete bonusAnswers[k+':'+q.id]);saveBonus();go(-4,-4)}
</script></body></html>
