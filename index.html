<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Teoria Geral do Crime | Minicurso interativo</title><style>
:root{--bg:#0b1020;--side:#10182b;--card:#141e32;--edge:#293752;--fg:#eef3ff;--mut:#a0afc6;--mint:#59e2c2;--gold:#ffc777;--red:#ff8994;--blue:#8faeff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--fg)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}a{color:var(--mint)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--edge);padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 12px 24px}.brand strong{font-size:19px;display:block}.eyebrow{letter-spacing:.13em;text-transform:uppercase;color:var(--mint);font-weight:800;font-size:10px}.sub{color:var(--mut);font-size:13px}.navmod{margin:10px 0}.mod-btn,.topic-btn{width:100%;border:0;background:transparent;color:var(--fg);text-align:left;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.mod-btn{font-weight:750}.topic-btn{font-size:12px;padding:8px 10px 8px 25px;color:var(--mut)}.mod-btn:hover,.topic-btn:hover{background:#1d2b45}.active{background:#223451!important;color:white!important}.main{max-width:1150px;padding:36px 44px 120px;width:100%;margin:auto}.hero{padding:32px;border:1px solid #355177;border-radius:24px;background:radial-gradient(circle at 88% 8%,#24466c 0,transparent 40%),linear-gradient(125deg,#17294a,#10192a);margin-bottom:28px}.hero h1{font-size:clamp(28px,4.4vw,48px);letter-spacing:-.04em;line-height:1.13;margin:10px 0}.lead{color:#c5d4ea;max-width:850px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.chip{display:inline-flex;border:1px solid #425778;border-radius:30px;padding:5px 12px;font-size:12px;color:#bed0e7}.panel{border:1px solid var(--edge);background:var(--card);border-radius:18px;padding:25px;margin:18px 0}.panel h2{margin:0 0 8px;font-size:24px;letter-spacing:-.025em}.panel h3{margin:0 0 6px}.topic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.muted{color:var(--mut)}.pipeline{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:23px 0}.step{background:#1c3150;border:1px solid #3d5579;padding:13px 14px;border-radius:12px;flex:1;min-width:135px;text-align:center;font-weight:720;animation:rise .6s both}.step:nth-child(2){animation-delay:.12s}.step:nth-child(3){animation-delay:.24s}.step:nth-child(4){animation-delay:.36s}.step:nth-child(5){animation-delay:.48s}.arr{align-self:center;color:var(--mint);font-weight:900}.concept{padding:25px 0;border-top:1px solid var(--edge)}.concept:first-of-type{border-top:0}.count{color:var(--mint);font-size:12px;font-weight:800}.concept h3{font-size:20px;margin:5px 0 9px}.concept p{margin:7px 0 12px}.example{border-left:3px solid var(--blue);padding:12px 16px;background:#1a2942;border-radius:0 10px 10px 0;color:#c9d9f2}.fix{background:linear-gradient(135deg,#302c27,#232c38);border:1px solid #6b5943;border-radius:12px;padding:16px;margin-top:20px}.fix-head{color:var(--gold);font-size:11px;letter-spacing:.1em;font-weight:900;text-transform:uppercase}.fix button,.primary,.secondary{border-radius:10px;border:1px solid #53716f;background:#1d3e3e;color:#d5fff3;padding:9px 14px;font-weight:700}.fix button:hover,.primary:hover{filter:brightness(1.2)}.answer{margin-top:12px;background:#1d3434;border-radius:10px;padding:13px;border:1px solid #376b61}.hidden{display:none!important}.ref{font-size:11px;color:#91a7c5}.sim-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.quest{border:1px solid var(--edge);border-radius:13px;padding:18px;margin:14px 0;background:#101a2d}.qnum{font-size:11px;color:#a3b8d8;letter-spacing:.09em;font-weight:800}.choices{display:flex;gap:10px;margin-top:12px}.choice{flex:1;background:#1f3050;border:1px solid #486084;color:white;border-radius:10px;padding:11px}.choice:disabled{opacity:.65;cursor:default}.choice.correct{border-color:var(--mint);background:#15483e;color:#baffec;opacity:1}.choice.wrong{border-color:var(--red);background:#4b2634;color:#ffe1e4;opacity:1}.feedback{padding:12px;margin-top:12px;border-radius:9px;background:#1c2b41}.feedback.good{border-left:4px solid var(--mint)}.feedback.bad{border-left:4px solid var(--red)}.progress{height:7px;background:#29364d;border-radius:10px;overflow:hidden;margin:9px 0}.bar{height:100%;background:linear-gradient(90deg,#55d8b7,#a7d6ff);width:0%;transition:width .5s}.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.overview button{background:linear-gradient(135deg,#1a2c47,#15223a);border:1px solid var(--edge);border-radius:16px;color:white;text-align:left;padding:23px;min-height:145px}.overview button:hover{border-color:var(--mint)}.overview b{display:block;font-size:20px;margin:5px 0}.bottomnav{display:flex;gap:12px;justify-content:space-between;margin-top:35px}.secondary{background:#1a263e;color:#d7e6ff;border-color:#455779}.sticky-top{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:0 0 15px}.tag{font-size:12px;color:var(--mint)}.refs p{padding:8px 0;border-bottom:1px solid var(--edge);overflow-wrap:anywhere}.notice{border:1px solid #5c5342;background:#28261f;color:#f3ddb1;padding:14px 17px;border-radius:12px;margin:20px 0}.simple{display:flex;flex-wrap:wrap;gap:12px}.simple span{padding:9px 12px;background:#22334d;border-radius:10px;font-size:13px}.right{float:right}.backtop{position:fixed;right:18px;bottom:20px;border:1px solid #3b5b71;background:#233950;color:white;border-radius:40px;padding:9px 14px;box-shadow:0 8px 30px #0008}.small{font-size:12px}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:850px){.layout{display:block}.sidebar{position:relative;height:auto;padding:12px}.brand{padding:5px}.navlist{display:none}.sidebar.open .navlist{display:block}.main{padding:18px 15px 80px}.hero{padding:21px}.panel{padding:18px}.overview{grid-template-columns:1fr}.pipeline{display:grid;grid-template-columns:1fr}.arr{transform:rotate(90deg);justify-self:center}.topic-head{display:block}}
@media print{body{background:white;color:black}.sidebar,.backtop,.bottomnav,.choices,.fix button,.sticky-top{display:none!important}.layout{display:block}.main{max-width:none;padding:0}.hero,.panel,.quest,.fix,.example{color:black!important;background:white!important;box-shadow:none;border:1px solid #bbb}.hidden.answer{display:block!important}.panel{break-inside:avoid}.concept{break-inside:avoid}}

/* Integração audiovisual + seção de exercícios bônus */
.video-shell{background:linear-gradient(120deg,#17283e,#122f39);border:1px solid #376879;border-radius:17px;padding:22px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;align-items:center;position:relative;overflow:hidden}
.video-symbol{width:70px;height:70px;border-radius:19px;background:linear-gradient(135deg,#285f69,#173f55);display:flex;align-items:center;justify-content:center;font-size:30px;border:1px solid #4b8c98}
.video-shell h3{margin:2px 0 5px;font-size:19px}.video-shell p{margin:6px 0 12px;color:#bfd0e1}.video-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.video-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;background:#66dfc6;color:#092923!important;font-weight:800;border-radius:10px;padding:10px 15px;min-height:43px}.video-link:hover{background:#9df2e0}.vidnote{font-size:12px;color:#a7bfcc}.bonus-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 20px}.bonus-tab{border:1px solid #3a5270;border-radius:12px;padding:10px 15px;background:#192b44;color:#c7d6ee;font-weight:750}.bonus-tab.selected{border-color:#58e2c2;color:#081b1f;background:#58e2c2}.bonus-options{display:grid;gap:9px}.bonus-option{text-align:left;width:100%;background:#1a2942;color:#e1eaff;border:1px solid #38506f;border-radius:11px;padding:12px 14px;line-height:1.5}.bonus-option:hover:not(:disabled){border-color:#84c9f5;background:#263d60}.bonus-option.correct{border-color:#5bdfbb;background:#16453a;color:#c2fce8}.bonus-option.wrong{border-color:#ef8d98;background:#492735;color:#ffe4e7}.bonus-option:disabled{cursor:default}.bonus-card{background:#111d31;border:1px solid #2c3d57;border-radius:15px;padding:19px;margin-bottom:13px}.bonus-card h3{font-size:16px;font-weight:650;line-height:1.5;margin:8px 0 15px}.bonus-callout{font-size:12px;color:#9fc2d7}.bonus-stat{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.bonus-stat span{border:1px solid #344d66;border-radius:12px;padding:9px 13px;background:#16263c;color:#bfcfe2}.video-panel{scroll-margin-top:20px}.bonus-card{scroll-margin-top:12px}
@media(max-width:620px){.video-shell{grid-template-columns:1fr;padding:17px;gap:10px}.video-symbol{width:50px;height:50px;font-size:24px;border-radius:13px}.video-link{width:100%}.bonus-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.bonus-tab{padding:9px 7px;font-size:12px}.bonus-card{padding:15px}.video-shell h3{font-size:17px}}
@media print{.video-link,.bonus-tabs,.bonus-option{display:none!important}.video-shell{background:white;color:black}.video-shell p,.video-shell h3{color:black!important}}

/* Player MP4 local, responsivo e acessível */
.video-shell{display:block;padding:clamp(14px,3vw,23px)}
.video-player-header{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.video-player-header .video-symbol{width:50px;height:50px;flex:none;font-size:23px;border-radius:13px}
.video-player-header h3{margin:0 0 3px;font-size:clamp(16px,2.2vw,20px)}
.video-player-header p{margin:0;color:#bcd0e2;font-size:13px}
.video-shell video{width:100%;display:block;aspect-ratio:16/9;max-height:min(70vh,680px);background:#050a14;border-radius:12px;border:1px solid #36506a;object-fit:contain}
.video-player-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.video-player-footer .vidnote{line-height:1.5;flex:1}
.video-player-footer .video-link{padding:7px 12px;min-height:36px;font-size:12px;background:#203d4d;color:#c3e9e5!important;border:1px solid #50717a}
.video-player-footer .video-link:hover{background:#2b5360}
@media(max-width:620px){.video-shell{padding:12px}.video-player-header{gap:10px}.video-player-header .video-symbol{width:40px;height:40px;font-size:19px}.video-shell video{border-radius:9px}.video-player-footer{align-items:flex-start}.video-player-footer .video-link{width:auto}}
@media print{.video-shell video,.video-player-footer{display:none!important}.video-player-header{color:#000}}

.video-alert{margin-top:12px;padding:13px 15px;border:1px solid #db9b57;border-radius:11px;background:#382b20;color:#ffe2bd;font-size:13px;line-height:1.55}
.video-alert[hidden]{display:none!important}.video-file-button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid #5a9ca8;background:#204752;color:#d9ffff;font-weight:700;font-size:12px}.video-file-button:hover{background:#2d5966}.video-file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.video-help{font-size:12px;color:#a7bfcc}
@media print{.video-alert,.video-file-button{display:none!important}}
</style></head><body><div class="layout"><aside class="sidebar" id="side"><div class="brand"><span class="eyebrow">DIREITO PENAL I · FPJ</span><strong>Teoria Geral do Crime</strong><span class="sub">Percurso de estudo · 4 eixos</span></div><button class="secondary" id="menubtn" style="width:100%;margin-bottom:10px">☰ Assuntos</button><div class="navlist" id="nav"></div></aside><main class="main" id="main"></main></div><button class="backtop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Início</button><script>
const DATA={"modules":[{"name":"Ilicitude","icon":"⚖️","summary":"O fato típico normalmente indica contrariedade ao Direito; as justificantes autorizam excepcionalmente condutas que, isoladamente, se enquadrariam em tipos penais.","topics":[{"name":"Estrutura da ilicitude","summary":"Da tipicidade à antijuridicidade: a existência de fato típico não torna automática uma condenação.","flow":"Fato típico → indício de ilicitude → verificação de justificantes","concepts":[{"title":"Ilicitude e antijuridicidade","explain":"Ilicitude é a contrariedade da conduta ao ordenamento considerado como um todo. Na concepção analítica tripartite, vem depois da tipicidade e antes da culpabilidade.","example":"Uma lesão corporal típica pode ser lícita se indispensável para repelir agressão injusta.","claim":"Todo fato típico é necessariamente ilícito.","truth":false,"comment":"A tipicidade é indício, mas a legítima defesa e outras justificantes podem afastar a ilicitude.","ref":"CP, art. 23; GRECO, 2024"},{"title":"Autonomia de Beling","explain":"Na teoria da autonomia, tipicidade e ilicitude são categorias independentes: a realização do tipo não projeta sequer indício necessário de contrariedade ao Direito.","example":"Um comportamento pode preencher o tipo sem qualquer conclusão prévia sobre a justificativa.","claim":"Para Beling, tipicidade funciona como presunção relativa de ilicitude.","truth":false,"comment":"A presunção relativa caracteriza a teoria da indiciariedade de Mayer.","ref":"BELING, 1906; GRECO, 2024"},{"title":"Indiciariedade — Mayer","explain":"A teoria ratio cognoscendi considera o fato típico um indício de ilicitude, superável pela existência de justificante. É a explicação predominante na doutrina penal brasileira. Isso não elimina a presunção constitucional de inocência nem desloca integralmente o ônus probatório ao acusado.","example":"Há indício de ilicitude no homicídio típico, mas o contexto pode revelar legítima defesa.","claim":"A teoria da indiciariedade equipara fato típico e fato ilícito de modo absoluto.","truth":false,"comment":"A relação é indiciária e admite prova de uma causa justificante.","ref":"MAYER, 1915; CF, art. 5º, LVII; CPP, art. 386, VI"},{"title":"Ratio essendi — Mezger","explain":"Na teoria da absoluta dependência, a ilicitude integra a essência da tipicidade, construindo um tipo total de injusto. A exclusão da ilicitude repercute na própria concepção de tipo.","example":"Se uma ação é justificada, deixa de integrar o injusto típico nessa formulação.","claim":"Na ratio essendi, a ilicitude é essencial à caracterização do tipo injusto.","truth":true,"comment":"A corrente integra tipicidade e antijuridicidade de modo substancial.","ref":"MEZGER, 1930; BITENCOURT, 2024"},{"title":"Elementos negativos do tipo","explain":"A descrição típica conteria elementos positivos expressos e condições negativas implícitas: inexistência de justificantes. É construção dogmática distinta da indiciariedade.","example":"O enunciado matar alguém seria lido com a cláusula tácita sem causa justificante.","claim":"A teoria dos elementos negativos concebe as justificantes como condições negativas implícitas do tipo.","truth":true,"comment":"Se presente uma justificante, falta um elemento negativo necessário ao tipo total.","ref":"BITENCOURT, 2024"},{"title":"Justificantes legais e supralegais","explain":"O art. 23 prevê estado de necessidade, legítima defesa, estrito cumprimento do dever legal e exercício regular de direito. Hipóteses específicas, como o art. 128, e discussões sobre consentimento válido do titular de bem disponível complementam a sistemática.","example":"Uma cirurgia consentida e tecnicamente indicada não se confunde com agressão ilícita.","claim":"O art. 23 contém uma lista taxativa de todas as justificantes existentes no ordenamento.","truth":false,"comment":"Há permissões específicas e discussão doutrinária de justificantes supralegais.","ref":"CP, arts. 23 e 128; NUCCI, 2024"}]},{"name":"Estado de necessidade","summary":"O agente protege direito próprio ou alheio diante de perigo atual, inevitável e não voluntariamente provocado, desde que o sacrifício do interesse ameaçado não seja razoavelmente exigível.","flow":"Perigo atual → ausência de saída menos lesiva → ponderação → justificante","concepts":[{"title":"Perigo atual e iminente","explain":"A literalidade do art. 24 exige perigo atual. Parte relevante da doutrina compreende também perigo iminente, desde que concreto e imediatamente ameaçador; mero risco remoto não basta.","example":"Motorista desvia de desabamento em curso e danifica portão para salvar passageiros.","claim":"Perigo futuro hipotético basta, por si só, ao estado de necessidade.","truth":false,"comment":"Exige-se situação concreta e atual; a inclusão do iminente é debate interpretativo.","ref":"CP, art. 24; GRECO, 2024"},{"title":"Perigo não provocado voluntariamente","explain":"O agente não pode criar voluntariamente o perigo para se beneficiar da justificativa. Há divergência sobre se conduta culposa anterior também impede sua incidência; a leitura restritiva enfatiza a provocação dolosa.","example":"Provocar intencionalmente um incêndio para depois destruir bens de terceiro não autoriza invocação automática da excludente.","claim":"Não existe controvérsia sobre a aplicação da excludente quando o agente causou culposamente o perigo.","truth":false,"comment":"A extensão de provocação voluntária é debatida na doutrina.","ref":"CP, art. 24; MIRABETE; FABBRINI, 2024"},{"title":"Direito próprio ou de terceiro","explain":"O perigo pode atingir bem jurídico do próprio agente ou de terceiro. O socorro a outra pessoa não exige vínculo familiar, desde que os demais requisitos estejam presentes.","example":"Para evitar atropelamento de uma criança, alguém danifica cerca de terceiro.","claim":"O estado de necessidade somente protege direitos do próprio agente.","truth":false,"comment":"O art. 24 contempla expressamente direito próprio ou alheio.","ref":"CP, art. 24"},{"title":"Dever legal de enfrentar o perigo","explain":"O § 1º do art. 24 impede invocar a justificante por quem tinha dever legal de enfrentar aquele perigo, nos limites concretos do dever. Isso não obriga sacrifício suicida e pode suscitar inexigibilidade de conduta diversa.","example":"Bombeiro em serviço não pode abandonar qualquer ocorrência apenas porque existe risco inerente à função.","claim":"O dever legal de enfrentar o perigo equivale a obrigação irrestrita de morrer.","truth":false,"comment":"O alcance do dever deve ser examinado segundo risco, possibilidades reais e culpabilidade.","ref":"CP, art. 24, § 1º; GRECO, 2024"},{"title":"Inevitabilidade e subsidiariedade","explain":"A lesão ao bem alheio precisa ser necessária: se existe alternativa viável e menos gravosa capaz de afastar o perigo, essa deve ser escolhida.","example":"Para escapar de enchente, usar saída aberta é preferível a arrombar casa alheia.","claim":"A justificante é admitida mesmo quando havia alternativa segura e menos lesiva.","truth":false,"comment":"O art. 24 exige perigo que o agente não podia de outro modo evitar.","ref":"CP, art. 24"},{"title":"Necessidade defensiva e agressiva","explain":"Na modalidade defensiva, sacrifica-se bem do responsável pelo perigo; na agressiva, sacrifica-se direito de terceiro inocente. As consequências civis podem variar, notadamente pelos arts. 929 e 930 do CC.","example":"Quebrar barreira pertencente a terceiro inocente para escapar de inundação é hipótese de necessidade agressiva.","claim":"No estado de necessidade agressivo, o bem sacrificado pertence a quem criou o perigo.","truth":false,"comment":"Essa descrição é da forma defensiva; na agressiva o prejudicado não causou o perigo.","ref":"CC, arts. 929–930; CP, art. 24"},{"title":"Teoria unitária e diferenciadora","explain":"O CP comum brasileiro é usualmente explicado pela teoria unitária: estado de necessidade justificante; quando razoável exigir o sacrifício, a lei prevê possibilidade de redução de pena. A diferenciadora distingue estado justificante e exculpante e tem expressão em outros regimes, como o penal militar.","example":"Destruir bem de valor desmedidamente superior para proteger interesse menor pode excluir a justificativa, com exame do § 2º.","claim":"O art. 24, § 2º, estabelece redução obrigatória de pena.","truth":false,"comment":"O texto legal emprega poderá, e não deverá.","ref":"CP, art. 24, § 2º; CPM, arts. 39 e 43"},{"title":"Estado de necessidade putativo","explain":"Quando o perigo é imaginado, não há estado de necessidade real: o enquadramento pode envolver erro sobre pressuposto fático de justificante, conforme o art. 20, § 1º.","example":"Alguém arromba uma porta por acreditar justificadamente haver incêndio que não existe.","claim":"Uma situação de perigo apenas imaginada é sempre estado de necessidade real.","truth":false,"comment":"A existência do perigo é precisamente a distinção entre real e putativo.","ref":"CP, art. 20, § 1º"},{"title":"Estado de necessidade e crime habitual ou permanente","explain":"A permanência ou repetição da conduta torna excepcional a satisfação contínua dos requisitos de perigo atual e inevitabilidade. Não é adequado afirmar impossibilidade lógica absoluta: as circunstâncias concretas devem ser analisadas.","example":"Prática reiterada de profissão regulamentada sem habilitação não se justifica genericamente por necessidade econômica.","claim":"Necessidade econômica, isoladamente, torna lícito qualquer delito habitual.","truth":false,"comment":"É preciso demonstrar concretamente cada requisito do art. 24.","ref":"CP, art. 24; GRECO, 2024"},{"title":"Necessidade recíproca","explain":"Pode ocorrer quando duas pessoas procuram salvar direitos diante de um mesmo perigo, com colisão de interesses protegidos. A justificativa de cada conduta exige exame próprio e não cria autorização irrestrita para eliminar o outro.","example":"Náufragos disputam recurso de sobrevivência escasso.","claim":"A mera disputa por sobrevivência dispensa a análise de inevitabilidade e razoabilidade.","truth":false,"comment":"Cada reação continua condicionada pelos pressupostos legais.","ref":"CP, art. 24"}]},{"name":"Legítima defesa","summary":"Resposta necessária e moderada contra agressão humana injusta, atual ou iminente, a direito próprio ou alheio.","flow":"Agressão injusta → reação necessária → moderação → cessação","concepts":[{"title":"Agressão injusta","explain":"Exige-se conduta humana injusta, por ação ou omissão. Um animal espontaneamente agressivo costuma suscitar estado de necessidade; se instrumentalizado por uma pessoa, pode constituir agressão humana.","example":"Indivíduo ordena ao cão que ataque a vítima: a agressão é atribuível à pessoa.","claim":"Ataque espontâneo de animal é, ordinariamente, legítima defesa contra agressão humana.","truth":false,"comment":"Sem instrumentalização humana, o caso pode configurar estado de necessidade.","ref":"CP, arts. 24–25"},{"title":"Agressão atual ou iminente","explain":"A reação é permitida durante a agressão ou ante sua iminência concreta. Retaliação posterior e temor abstrato não bastam.","example":"Desarmar atacante que já aponta uma arma pode ser reação contra agressão iminente.","claim":"A vingança realizada horas após o encerramento da agressão é legítima defesa.","truth":false,"comment":"Agressão passada não satisfaz a atualidade ou iminência.","ref":"CP, art. 25"},{"title":"Direito próprio e de terceiro","explain":"A defesa pode proteger o próprio agente ou qualquer terceiro. O caráter injusto da agressão e o emprego dos meios necessários seguem indispensáveis.","example":"Uma pessoa intervém para impedir que um desconhecido seja violentamente atacado.","claim":"Não se admite legítima defesa de pessoa sem parentesco com o agente.","truth":false,"comment":"O art. 25 fala em direito seu ou de outrem.","ref":"CP, art. 25"},{"title":"Meios necessários e moderação","explain":"A resposta deve ser apta a interromper a agressão e não pode ultrapassar o necessário. Não se reduz a comparação abstrata dos valores dos bens: intensidade, contexto e alternativas concretas são decisivos.","example":"Após imobilizar o agressor e cessar o risco, continuar golpeando-o caracteriza possível excesso.","claim":"A ameaça a patrimônio autoriza automaticamente uso letal de força.","truth":false,"comment":"É indispensável examinar necessidade e moderação; proteção patrimonial não confere licença geral para matar.","ref":"CP, arts. 23, par. único, e 25"},{"title":"Legítima defesa real e putativa","explain":"Na real, a agressão existe. Na putativa, o agente imagina situação que justificaria a reação; o erro sobre fatos tem tratamento específico no art. 20, § 1º.","example":"Pessoa interpreta objeto inofensivo como arma em condições concretas de erro.","claim":"Na legítima defesa putativa, a agressão injusta necessariamente existiu.","truth":false,"comment":"A agressão foi suposta; examinam-se as condições do erro.","ref":"CP, art. 20, § 1º"},{"title":"Excesso doloso ou culposo","explain":"A excludente não cobre o excesso praticado além dos seus limites. O art. 23, parágrafo único, estabelece responsabilização por excesso doloso ou culposo conforme a tipicidade da conduta.","example":"Após cessar o ataque, o agente atinge deliberadamente o agressor.","claim":"A presença inicial de legítima defesa torna juridicamente irrelevante qualquer excesso posterior.","truth":false,"comment":"O excesso é expressamente disciplinado pelo art. 23, parágrafo único.","ref":"CP, art. 23, parágrafo único"},{"title":"Legítima defesa sucessiva","explain":"Admite-se defesa contra a parcela excessiva da reação inicialmente justificada: quem excede transforma sua conduta excedente em agressão injusta. Não se admite legítima defesa recíproca real simultânea diante de duas agressões ambas justas.","example":"Agressor inicial é contido; o defensor prossegue em violência excessiva; o primeiro pode repelir o excesso.","claim":"A legítima defesa sucessiva pode ocorrer diante de excesso da defesa inicial.","truth":true,"comment":"A injustiça superveniente do excesso fundamenta nova reação necessária.","ref":"CP, arts. 23 e 25; GRECO, 2024"},{"title":"Legítima defesa da honra","explain":"A tese de legítima defesa da honra, quando usada para justificar violência em contexto de relações afetivas, é incompatível com a Constituição; o STF a reputou inconstitucional na ADPF 779.","example":"Ciúme ou alegada infidelidade não tornam legítimo matar ou agredir companheira.","claim":"O STF considerou constitucional a legítima defesa da honra em crimes contra a vida.","truth":false,"comment":"A ADPF 779 rejeitou a tese por incompatibilidade com dignidade, igualdade e proteção à vida.","ref":"STF, ADPF 779"},{"title":"Defesa presumida e defesa putativa recíproca","explain":"Não existe presunção geral que dispense comprovar os requisitos do art. 25. Situações em que ambos supõem equivocadamente agressões podem configurar defesas putativas recíprocas, sob análise individual de erro.","example":"Duas pessoas interpretam simultaneamente gestos ambíguos como ataque iminente, sem agressão real.","claim":"A mera alegação de medo presume, de forma absoluta, legítima defesa real.","truth":false,"comment":"Agressão injusta real e demais requisitos precisam de comprovação.","ref":"CP, arts. 20, § 1º, e 25"},{"title":"Erro na execução em contexto defensivo","explain":"No desvio de golpe, os arts. 73 e 74 do CP podem ser relevantes para a imputação do resultado diverso do pretendido, considerando a situação justificante, o nexo e eventual culpa. Não se dispensa análise do caso concreto.","example":"Ao repelir agressão efetiva, um disparo atinge pessoa diversa do agressor.","claim":"O desvio do golpe em legítima defesa impõe necessariamente responsabilidade dolosa contra terceiro atingido.","truth":false,"comment":"A análise envolve erro na execução, justificante e possível culpa residual.","ref":"CP, arts. 23, 25 e 73"}]},{"name":"Outras justificantes","summary":"Além das causas de perigo e agressão, o Direito autoriza ações decorrentes de obrigações legais ou do exercício legítimo de direitos.","flow":"Dever legal / direito regularmente exercido → limites normativos → ausência de ilicitude","concepts":[{"title":"Estrito cumprimento do dever legal","explain":"Abrange a conduta que executa obrigação imposta pela ordem jurídica, respeitados os seus limites e requisitos. A existência de ordem manifestamente ilegal não torna a conduta lícita.","example":"Agente cumpre mandado judicial válido dentro do escopo autorizado.","claim":"Qualquer ato de servidor público configura estrito cumprimento do dever legal.","truth":false,"comment":"A justificante pressupõe dever jurídico concreto e observância de seus limites.","ref":"CP, art. 23, III"},{"title":"Exercício regular de direito","explain":"A prática de ato permitido por direito reconhecido pode excluir a ilicitude, desde que exercido regularmente e sem abuso.","example":"Atleta pratica contato corporal permitido pelas regras da modalidade esportiva.","claim":"O abuso de direito permanece necessariamente protegido pelo exercício regular de direito.","truth":false,"comment":"O excesso ou abuso retira a regularidade exigida.","ref":"CP, art. 23, III; CC, art. 187"},{"title":"Consentimento do ofendido","explain":"A doutrina discute a exclusão da tipicidade ou da ilicitude pelo consentimento válido, dependendo do tipo penal, da disponibilidade do bem e do momento da anuência. É inadequado tratá-lo como justificante universal.","example":"O consentimento para procedimento médico lícito é distinto do suposto consentimento para grave violência contra bem indisponível.","claim":"O consentimento do ofendido afasta a ilicitude de qualquer crime.","truth":false,"comment":"A eficácia depende de requisitos específicos e da disponibilidade do interesse protegido.","ref":"NUCCI, 2024; BITENCOURT, 2024"}]}]},{"name":"Culpabilidade","icon":"🧠","summary":"A culpabilidade examina a possibilidade de reprovar pessoalmente o agente por um fato típico e ilícito, segundo sua capacidade, consciência potencial e exigibilidade de comportamento conforme o Direito.","topics":[{"name":"Fundamentos e teorias","summary":"O juízo de reprovação evoluiu de uma explicação psíquica para uma construção normativa baseada na responsabilidade pelo fato.","flow":"Fato típico + ilícito → imputabilidade + consciência potencial + exigibilidade","concepts":[{"title":"Teoria bipartite e tripartite","explain":"Para a corrente tripartite, crime exige tipicidade, ilicitude e culpabilidade. Na bipartite, a culpabilidade opera como pressuposto de pena. A classificação é controvertida, não uma definição expressa e exclusiva do CP.","example":"Inimputabilidade exclui culpabilidade na estrutura tripartite, sem impedir necessariamente medida de segurança.","claim":"O Código Penal define expressamente o crime como fato típico, ilícito e culpável.","truth":false,"comment":"A estrutura analítica deriva da dogmática; o CP não contém essa fórmula como definição expressa.","ref":"BITENCOURT, 2024; GRECO, 2024"},{"title":"Teoria psicológica — Liszt/Beling","explain":"Relaciona culpabilidade ao vínculo psicológico entre autor e resultado, principalmente dolo e culpa, tratando a imputabilidade como pressuposto. Apresenta dificuldades para explicar a culpa inconsciente.","example":"A avaliação se concentra na vontade e na previsibilidade do resultado.","claim":"Na teoria psicológica, dolo e culpa são espécies centrais da culpabilidade.","truth":true,"comment":"A estrutura psicológica organiza a culpabilidade em dolo e culpa.","ref":"VON LISZT, 1899; BELING, 1906"},{"title":"Teoria psicológico-normativa — Frank","explain":"Reinhard Frank introduz a censurabilidade e a exigibilidade, preservando dolo e culpa no interior da culpabilidade e agregando a dimensão normativa.","example":"Um comportamento doloso sob coação extrema pode não ser censurável.","claim":"A teoria psicológico-normativa elimina completamente o dolo da culpabilidade.","truth":false,"comment":"Ela mantém dolo e culpa na culpabilidade e acrescenta exigência normativa.","ref":"FRANK, 1907; BITENCOURT, 2024"},{"title":"Finalismo e teoria normativa pura — Welzel","explain":"No finalismo, dolo e culpa integram o tipo; culpabilidade se concentra em imputabilidade, consciência potencial da ilicitude e exigibilidade de conduta diversa.","example":"O agente quer a subtração (dolo típico), mas sua culpabilidade requer análise separada.","claim":"Na concepção finalista, o dolo permanece necessariamente como elemento da culpabilidade.","truth":false,"comment":"O dolo passa a integrar a conduta típica.","ref":"WELZEL, 1939; CP, arts. 18, 21 e 26"},{"title":"Teoria limitada da culpabilidade","explain":"Na leitura predominante da reforma penal de 1984, erro sobre situação de fato justificante é tratado conforme art. 20, § 1º; erro sobre existência ou limites jurídicos de permissão remete ao art. 21. A terminologia de teoria adotada é classificação doutrinária.","example":"Imagina-se agressão real por erro de percepção: examina-se pressuposto fático, não regra abstrata de autorização.","claim":"A teoria limitada trata todo erro sobre descriminante putativa indistintamente como erro de proibição.","truth":false,"comment":"Distingue erro fático dos erros sobre permissão jurídica.","ref":"CP, arts. 20, § 1º, e 21; GRECO, 2024"},{"title":"Culpabilidade do fato e coculpabilidade","explain":"A censura deve se concentrar no comportamento e não na identidade ou condição social do agente. Zaffaroni discute coculpabilidade estatal diante da desigualdade; sua incidência judicial não é automática nem expressamente codificada.","example":"Vulnerabilidade social contextualizada pode ser debatida em tese na análise da circunstância relevante do art. 66.","claim":"A coculpabilidade é atenuante obrigatória expressamente nominada no CP.","truth":false,"comment":"Não há previsão expressa com esse nome; sua eventual aplicação é controvertida.","ref":"CP, art. 66; ZAFFARONI; PIERANGELI, 2011"},{"title":"Coculpabilidade às avessas","explain":"Expressão crítica que discute seletividade e assimetrias do sistema penal, inclusive tratamentos mais favoráveis a certos delitos econômicos e maior controle sobre vulneráveis. Não constitui agravante autônoma prevista em lei.","example":"Ter alta renda não cria automaticamente agravante genérica de pena.","claim":"O juiz pode aplicar a coculpabilidade às avessas como agravante expressa do art. 61.","truth":false,"comment":"Não existe agravante legal autônoma com essa denominação.","ref":"CP, arts. 59 e 61; ZAFFARONI; PIERANGELI, 2011"}]},{"name":"Imputabilidade","summary":"Capacidade de compreender a ilicitude e de se autodeterminar no momento da conduta, observadas as regras específicas da lei.","flow":"Condição pessoal + capacidade no momento do fato → regime jurídico","concepts":[{"title":"Critérios biológico, psicológico e biopsicológico","explain":"O critério biológico considera condição objetiva, o psicológico a capacidade concreta e o biopsicológico exige condição relevante associada a incapacidade funcional no momento do fato. O CP aplica critério biopsicológico no art. 26 e etário objetivo no art. 27.","example":"Diagnóstico psiquiátrico isolado não demonstra inimputabilidade no art. 26.","claim":"O art. 26 utiliza apenas a existência de diagnóstico, sem avaliar capacidade ao tempo da ação.","truth":false,"comment":"A norma requer incapacidade de entendimento ou autodeterminação decorrente da condição.","ref":"CP, arts. 26–27"},{"title":"Inimputabilidade por transtorno mental","explain":"O art. 26 exige doença mental ou desenvolvimento mental incompleto/retardado e incapacidade integral de entender a ilicitude ou orientar-se por esse entendimento ao tempo do fato. O tratamento legal deve ser lido à luz dos direitos humanos e da política antimanicomial.","example":"Pessoa com doença mental que preserva plenamente entendimento no momento do fato não se torna automaticamente inimputável.","claim":"A existência de doença mental sempre exclui a imputabilidade penal.","truth":false,"comment":"É indispensável vincular a condição à incapacidade funcional no momento da conduta.","ref":"CP, art. 26; CNJ, Res. 487/2023"},{"title":"Semi-imputabilidade","explain":"O art. 26, parágrafo único, permite diminuição de um a dois terços quando a capacidade estava reduzida, sem supressão integral. O art. 98 admite substituição por medida de segurança quando necessários cuidados especiais.","example":"A redução de capacidade pode repercutir na pena, sem absolvição imprópria automática.","claim":"Na semi-imputabilidade, a diminuição legal possível é de um a dois terços.","truth":true,"comment":"Essa é a faixa prevista no parágrafo único do art. 26.","ref":"CP, arts. 26, par. único, e 98"},{"title":"Menoridade penal","explain":"Menores de 18 anos são penalmente inimputáveis e submetem-se à legislação especial. Aplica-se critério etário objetivo, independentemente de avaliação individual de maturidade.","example":"Adolescente de 17 anos que pratica fato descrito como crime sujeita-se ao sistema socioeducativo, conforme requisitos legais.","claim":"O menor de 18 anos pode ser declarado penalmente imputável por laudo que demonstre alta maturidade.","truth":false,"comment":"A idade é critério objetivo do art. 27 e da Constituição.","ref":"CP, art. 27; CF, art. 228; ECA"},{"title":"Embriaguez voluntária e culposa","explain":"O art. 28, II, em regra não exclui imputabilidade por embriaguez voluntária ou culposa. A actio libera in causa exige cautela: não se deve pressupor dolo quanto ao delito posterior apenas por ter bebido.","example":"Beber voluntariamente não implica automaticamente ter desejado homicídio posteriormente ocorrido.","claim":"A embriaguez voluntária constitui, por si só, causa legal de inimputabilidade.","truth":false,"comment":"A lei expressamente afasta esse efeito no art. 28, II.","ref":"CP, art. 28, II; BITENCOURT, 2024"},{"title":"Embriaguez fortuita ou por força maior","explain":"Embriaguez completa involuntária com incapacidade integral pode isentar de pena; se houver redução relevante da capacidade, admite-se diminuição de um a dois terços.","example":"Bebida adulterada sem conhecimento pode suscitar art. 28, §§ 1º–2º.","claim":"Embriaguez completa por caso fortuito jamais pode excluir responsabilidade penal.","truth":false,"comment":"O art. 28, § 1º prevê isenção nas condições legais.","ref":"CP, art. 28, §§ 1º–2º"},{"title":"Embriaguez preordenada e patológica","explain":"A preordenada visa facilitar o crime e é agravante legal. Embriaguez patológica pode requerer análise sob o art. 26 quando caracterizada condição psíquica relevante.","example":"Beber para ganhar coragem antes de executar crime planejado: preordenação.","claim":"Embriaguez preordenada constitui atenuante genérica.","truth":false,"comment":"É agravante prevista no art. 61, II, l.","ref":"CP, arts. 26 e 61, II, l"}]},{"name":"Consciência e exigibilidade","summary":"A culpabilidade exige possibilidade de conhecimento da proibição e possibilidade concreta de agir licitamente.","flow":"Capacidade → conhecimento potencial → comportamento exigível","concepts":[{"title":"Potencial consciência da ilicitude","explain":"Não é obrigatório demonstrar que o agente efetivamente conhecia o artigo de lei; importa avaliar se podia compreender a proibição nas circunstâncias.","example":"Uma proibição excepcional de difícil acesso pode ser relevante para examinar erro de proibição.","claim":"A culpabilidade requer conhecimento técnico do número e redação do tipo penal.","truth":false,"comment":"O elemento é possibilidade concreta de conhecimento da ilicitude.","ref":"CP, art. 21"},{"title":"Erro de proibição inevitável e evitável","explain":"Erro inevitável sobre a ilicitude isenta de pena; quando evitável, pode reduzir pena de um sexto a um terço. Desconhecimento da lei e erro de proibição não são conceitos equivalentes.","example":"Agente acredita, diante de circunstâncias justificáveis, que conduta proibida era permitida.","claim":"Erro de proibição evitável exclui obrigatoriamente a pena.","truth":false,"comment":"Se evitável, a lei prevê possibilidade de diminuição.","ref":"CP, art. 21"},{"title":"Coação moral irresistível","explain":"Sob ameaça moral irresistível, a culpabilidade do coagido é excluída; responde o autor da coação. Diferencia-se da coação física irresistível, que pode afastar a própria conduta voluntária.","example":"Ameaça grave e inevitável força alguém a praticar ato criminoso.","claim":"A coação moral irresistível é causa legal de exclusão da culpabilidade.","truth":true,"comment":"É hipótese do art. 22 do CP.","ref":"CP, art. 22"},{"title":"Obediência hierárquica","explain":"A ordem de superior hierárquico não manifestamente ilegal, nas condições do art. 22, pode excluir culpabilidade do subordinado. Ordem claramente criminosa não recebe proteção.","example":"Subordinado recebe ordem funcional aparentemente válida, sem sinais evidentes de ilegalidade.","claim":"Toda ordem superior, inclusive manifestamente ilegal, exclui a culpabilidade do executor.","truth":false,"comment":"O dispositivo exige que a ordem não seja manifestamente ilegal.","ref":"CP, art. 22"},{"title":"Inexigibilidade supralegal de conduta diversa","explain":"Além das hipóteses do art. 22, parte da doutrina e jurisprudência admite discutir situações extremas em que não seria razoável exigir outra atuação, sem aplicação automática.","example":"Perigo extraordinário que supera concretamente a resistência esperável do agente.","claim":"A inexigibilidade de conduta diversa é irrelevante para a análise da culpabilidade.","truth":false,"comment":"É elemento central do juízo de reprovação, inclusive em hipóteses legais expressas.","ref":"GRECO, 2024; CP, art. 22"},{"title":"Erro de proibição direto e indireto","explain":"No direto, desconhece-se ou interpreta-se equivocadamente a proibição. No indireto, supõe-se norma permissiva inexistente ou seus limites mais amplos; não se confunde com erro sobre circunstância fática justificante.","example":"A acredita que a lei permite agredir devedor para cobrar dívida: erro quanto ao alcance da permissão.","claim":"Erro de proibição indireto é necessariamente erro sobre a presença física de agressão inexistente.","truth":false,"comment":"Esse último pode ser erro fático sobre pressuposto justificante; o indireto é erro sobre permissão normativa.","ref":"CP, arts. 20, § 1º, e 21"}]}]},{"name":"Iter criminis","icon":"🧭","summary":"O percurso do delito esclarece quando o comportamento passa a ser punível e quais efeitos decorrem de interrupção, abandono, reparação e impossibilidade de consumação.","topics":[{"name":"Etapas e início da execução","summary":"A progressão do projeto delitivo não permite punir pensamentos, e os atos preparatórios só são puníveis quando constituem infrações autônomas.","flow":"Cogitação → preparação → execução → consumação","concepts":[{"title":"Cogitação","explain":"Fase interna em que surge ou amadurece a intenção criminosa. No direito penal do fato, a ideia isolada não é punível.","example":"Imaginar um furto sem qualquer ação exterior.","claim":"A simples cogitação do crime configura tentativa punível.","truth":false,"comment":"Tentativa pressupõe início da execução, não pensamento.","ref":"CP, art. 14, II"},{"title":"Atos preparatórios","explain":"Organizam meios para o delito sem iniciar execução. Regra: não puníveis como tentativa; podem configurar crimes autônomos tipificados.","example":"Aquisição irregular de arma pode constituir infração autônoma mesmo antes de tentativa de homicídio.","claim":"Todo ato preparatório é punido como tentativa do crime planejado.","truth":false,"comment":"Preparação e execução não se confundem; existem tipos preparatórios autônomos.","ref":"CP, art. 14, II; Lei 10.826/2003"},{"title":"Atos executórios","explain":"São comportamentos que já ingressam na realização do delito, segundo critérios de proximidade e concretização do tipo. O marco exato pode ser controvertido.","example":"O começo da subtração de coisa alheia é ato executório no furto.","claim":"A tentativa pode existir sem qualquer início de execução.","truth":false,"comment":"O art. 14, II, expressamente exige execução iniciada.","ref":"CP, art. 14, II"},{"title":"Consumação","explain":"O crime se consuma com a reunião de todos os elementos de sua definição legal, não necessariamente com exaurimento ou proveito econômico definitivo.","example":"No furto, a inversão da posse pode consumar o crime ainda que haja recuperação imediata do bem.","claim":"Consumação e exaurimento são sempre o mesmo evento.","truth":false,"comment":"Exaurimento é etapa posterior eventual, não requisito universal.","ref":"CP, art. 14, I; STJ, Súmula 582"},{"title":"Teorias de demarcação da execução","explain":"Hostilidade ao bem jurídico antecipa marco pelo risco; objetivo-formal exige começo do verbo típico; objetivo-material alcança atos imediatamente anteriores; objetivo-individual combina proximidade e plano concreto do autor. Não há enunciado único do CP que escolha expressamente uma dessas quatro.","example":"Em roubo, entrar no local com arma empunhada pode ser avaliado de modo diferente conforme a teoria.","claim":"O CP nomeia expressamente a teoria objetivo-individual no art. 14.","truth":false,"comment":"O art. 14 exige execução, sem definir legislativamente uma teoria por nome.","ref":"CP, art. 14; ROXIN, 2000"}]},{"name":"Tentativa e crime impossível","summary":"Para tentativa, são necessários dolo de consumação, execução iniciada e frustração por motivo alheio à vontade do agente.","flow":"Início de execução + não consumação involuntária = tentativa","concepts":[{"title":"Requisitos da tentativa","explain":"A tentativa ocorre após início da execução e antes da consumação, quando a interrupção independe da vontade do agente. O querer consumar diferencia-a do abandono voluntário.","example":"Disparo dirigido à vítima que sobrevive por atendimento médico eficaz.","claim":"A desistência espontânea do agente, antes da consumação, sempre caracteriza tentativa.","truth":false,"comment":"Desistência voluntária tem regime próprio no art. 15.","ref":"CP, arts. 14, II, e 15"},{"title":"Teorias da punição da tentativa","explain":"A objetiva considera menor o desvalor da não consumação; a subjetiva enfatiza a vontade do autor; a sintomática a periculosidade. O CP segue regra objetiva de redução, com tipos de empreendimento que equiparam condutas.","example":"Tentativa de homicídio recebe redução em comparação à forma consumada, ressalvadas regras legais.","claim":"A pena da tentativa no CP é, em regra, idêntica à do crime consumado.","truth":false,"comment":"O art. 14, parágrafo único, prevê redução de um a dois terços.","ref":"CP, art. 14, par. único; BITENCOURT, 2024"},{"title":"Fração redutora","explain":"Em regra a pena da tentativa diminui de um a dois terços; maior proximidade da consumação tende a justificar menor redução, mediante fundamentação concreta.","example":"Agente realiza todos os disparos e falha por socorro: menor redução pode ser justificável.","claim":"A pena da tentativa deve sempre ser reduzida exatamente pela metade.","truth":false,"comment":"A faixa é variável de 1/3 a 2/3 conforme o caso.","ref":"CP, art. 14, par. único"},{"title":"Tentativa perfeita e imperfeita","explain":"Na imperfeita, a execução é interrompida antes de todos os atos previstos; na perfeita ou acabada, o agente esgota a execução, mas não obtém consumação.","example":"Atirador descarrega arma e a vítima é salva: tentativa acabada, se não houve morte.","claim":"Tentativa perfeita significa que o crime foi consumado.","truth":false,"comment":"Perfeita refere-se ao esgotamento dos atos executórios, sem consumação.","ref":"GRECO, 2024"},{"title":"Tentativa branca e vermelha","explain":"A branca ou incruenta não causa lesão corporal à vítima; a vermelha ou cruenta causa atingimento, sem consumação do delito pretendido. A classificação não determina isoladamente gravidade jurídica.","example":"Disparo erra o alvo: tentativa branca de homicídio.","claim":"Tentativa vermelha exige obrigatoriamente a morte da vítima.","truth":false,"comment":"Atingimento não se confunde com morte ou consumação.","ref":"BITENCOURT, 2024"},{"title":"Infrações incompatíveis com tentativa","explain":"Em regra, não cabe tentativa em crimes culposos, unissubsistentes, habituais e contravenções (art. 4º da LCP). Há controvérsias e exceções aparentes conforme estrutura de cada tipo.","example":"Uma contravenção tentada não recebe sanção de tentativa pela LCP.","claim":"A tentativa de contravenção penal é punível pelo regime geral do art. 14 do CP.","truth":false,"comment":"O art. 4º da LCP afasta expressamente a punição da tentativa.","ref":"Decreto-Lei 3.688/1941, art. 4º"},{"title":"Crime impossível","explain":"O art. 17 considera impunível tentativa quando absoluta ineficácia do meio ou impropriedade absoluta do objeto tornam impossível consumar. A ineficácia apenas relativa pode permitir tentativa punível.","example":"Tentar matar pessoa já morta, acreditando estar viva: objeto absolutamente impróprio.","claim":"Meio apenas relativamente ineficaz afasta toda tentativa por crime impossível.","truth":false,"comment":"A lei exige ineficácia absoluta ou impropriedade absoluta.","ref":"CP, art. 17"},{"title":"Crime de atentado","explain":"Em tipos de empreendimento a própria lei equipara tentar e consumar determinada conduta, afastando a redução ordinária por tentativa quanto à conduta tipificada.","example":"Art. 352 descreve evadir-se ou tentar evadir-se com violência contra pessoa.","claim":"Todos os crimes tentados são necessariamente punidos com redução de 1/3 a 2/3.","truth":false,"comment":"O art. 14 admite disposição em contrário; há tipos de empreendimento.","ref":"CP, arts. 14 e 352"},{"title":"Tentativa supersticiosa","explain":"Há crença subjetiva de eficácia causal sem aptidão material para realizar o tipo. Diferencia-se da execução por meio relativamente capaz e da impossível por inadequação absoluta.","example":"Alguém acredita conseguir matar inimigo apenas por ritual mental privado.","claim":"O simples desejo de provocar morte por pensamento constitui tentativa de homicídio.","truth":false,"comment":"Não há início idôneo de execução de homicídio.","ref":"CP, arts. 14 e 17"}]},{"name":"Abandono e reparação","summary":"O instante e a causa da não consumação determinam o enquadramento: impedimento alheio, abandono voluntário ou reparação posterior não são equivalentes.","flow":"Execução interrompida pelo agente → art. 15 | crime consumado e reparado → art. 16","concepts":[{"title":"Desistência voluntária","explain":"Durante a execução, o agente voluntariamente deixa de prosseguir, podendo continuar. Responde apenas pelos atos já praticados que constituam delito. Não exige arrependimento moral espontâneo.","example":"Agente começa a arrombar estabelecimento e decide não entrar, sem interferência externa impeditiva.","claim":"Na desistência voluntária, o agente é impedido por intervenção policial inevitável.","truth":false,"comment":"Nesse caso há circunstância alheia; a desistência exige decisão voluntária.","ref":"CP, art. 15"},{"title":"Arrependimento eficaz","explain":"Depois de esgotados atos executórios, mas antes de ocorrer o resultado, o autor voluntariamente o impede de modo efetivo. Responde por ilícitos remanescentes.","example":"Autor ministra veneno e, antes da morte, fornece antídoto que efetivamente salva a vítima.","claim":"Basta tentar socorrer a vítima, mesmo que a morte ocorra, para configurar arrependimento eficaz.","truth":false,"comment":"A eficácia real em impedir o resultado é indispensável.","ref":"CP, art. 15"},{"title":"Arrependimento posterior","explain":"Depois da consumação, a reparação ou restituição voluntária até o recebimento da denúncia/queixa pode reduzir pena 1/3–2/3 em crime sem violência ou grave ameaça à pessoa. STJ exige delito patrimonial ou com efeitos patrimoniais.","example":"Após consumar furto sem violência, agente devolve integralmente objeto antes do recebimento da denúncia.","claim":"O art. 16 extingue automaticamente a tipicidade do fato já consumado.","truth":false,"comment":"É causa de diminuição de pena e não exclusão da tipicidade.","ref":"CP, art. 16; STJ, Informativo 590"},{"title":"Ponte de ouro e ponte de prata","explain":"Ponte de ouro: o art. 15 favorece a interrupção eficaz do delito e deixa responsabilidade pelos atos remanescentes. Ponte de prata: o art. 16 premia reparação posterior, com redução de pena.","example":"Salvamento após tentativa de envenenamento versus devolução após furto consumado.","claim":"Ponte de ouro e ponte de prata produzem exatamente a mesma consequência jurídica.","truth":false,"comment":"Uma impede a responsabilização pelo delito inicialmente pretendido; a outra reduz pena do fato consumado.","ref":"CP, arts. 15–16"}]}]},{"name":"Concurso de pessoas","icon":"🤝","summary":"Investiga quando várias condutas concorrem para o mesmo crime, distinguindo autor, coautor e partícipe e delimitando a responsabilidade individual.","topics":[{"name":"Fundamentos e teorias","summary":"Pluralidade e nexo subjetivo não dispensam contribuição relevante nem responsabilidade na medida da culpabilidade.","flow":"Agentes → liame subjetivo + contribuição relevante → fato comum","concepts":[{"title":"Requisitos do concurso","explain":"Exigem-se pluralidade de condutas, relevância causal/normativa, vínculo subjetivo e, em regra, identidade de infração. Prévio ajuste formal não é indispensável; a adesão pode ser durante a execução.","example":"A percebe o roubo em curso e conscientemente auxilia B a executá-lo.","claim":"Sem vínculo subjetivo entre agentes sempre haverá concurso de pessoas.","truth":false,"comment":"A mera coincidência de ações pode caracterizar autoria colateral.","ref":"CP, art. 29"},{"title":"Teoria monista, dualista e pluralista","explain":"A monista prevê crime único para concorrentes, com individualização de culpabilidade (art. 29). A dualista distingue delito de autores e partícipes; a pluralista admite tipos distintos conforme previsão legal, como corrupção ativa e passiva.","example":"Particular oferece vantagem indevida e servidor a solicita ou recebe: tipos autônomos possíveis.","claim":"O art. 29 consagra como regra a teoria dualista.","truth":false,"comment":"A regra é monista, ressalvadas previsões específicas.","ref":"CP, arts. 29, 317 e 333"},{"title":"Responsabilidade individual","explain":"Responder pelo mesmo tipo não impõe pena idêntica: autoria, contribuição, dolo, menor importância e culpabilidade exigem individualização.","example":"Instigador e executor podem receber penas diferentes.","claim":"A teoria monista impede individualização da pena entre concorrentes.","truth":false,"comment":"O caput do art. 29 ressalva na medida da culpabilidade.","ref":"CP, art. 29"}]},{"name":"Autoria e coautoria","summary":"A qualificação de autor depende da teoria adotada e do controle real da realização típica; simples posição hierárquica ou influência não prova automaticamente autoria.","flow":"Execução material / domínio da vontade / domínio funcional","concepts":[{"title":"Teoria objetivo-formal","explain":"Autor executa o núcleo verbal do tipo; partícipe colabora dolosamente sem realizá-lo. É critério clássico e influente, mas não resolve sozinho todos os casos complexos.","example":"Quem subtrai a coisa pratica o núcleo do furto; auxiliar consciente pode ser partícipe.","claim":"Na teoria objetivo-formal, qualquer pessoa que conheça o crime torna-se autor.","truth":false,"comment":"Exige execução do núcleo típico para autoria, não conhecimento isolado.","ref":"CP, art. 29; BITENCOURT, 2024"},{"title":"Domínio do fato — Welzel e Roxin","explain":"A formulação de domínio do fato foi desenvolvida no finalismo de Welzel e sistematizada por Claus Roxin: domínio da ação, da vontade ou funcional. Não equivale a responsabilização penal automática de chefias.","example":"Dirigente com poder de comando não responde sem elementos de contribuição concreta e elemento subjetivo.","claim":"O cargo de diretor, por si só, comprova domínio do fato e autoria de todo delito da organização.","truth":false,"comment":"A teoria exige elementos específicos de domínio e responsabilidade individual.","ref":"WELZEL, 1939; ROXIN, 2000"},{"title":"Autoria imediata e mediata","explain":"Autor imediato pratica pessoalmente a execução; o mediato se vale de terceiro instrumentalizado por erro, coação ou outra condição dogmaticamente pertinente.","example":"Pessoa engana enfermeiro para administrar substância letal acreditando ser medicamento.","claim":"Na autoria mediata, o autor necessariamente pratica com as próprias mãos o núcleo do tipo.","truth":false,"comment":"O domínio se exerce por intermédio do executor instrumentalizado.","ref":"ROXIN, 2000; GRECO, 2024"},{"title":"Autoria em aparato organizado de poder","explain":"Roxin analisa domínio da organização sob pressupostos específicos, como poder de mando, funcionamento dissociado do direito e fungibilidade do executor. Exige prova contextual e não decorre de chefia isolada.","example":"Ordem ilícita dentro de estrutura organizada com executores substituíveis.","claim":"A autoria por organização dispensa comprovação de poder de mando e dinâmica concreta.","truth":false,"comment":"Esses requisitos integram a construção teórica.","ref":"ROXIN, 2000"},{"title":"Coautoria direta e funcional","explain":"Coautoria direta pode envolver atos executivos semelhantes; na funcional, divisão coordenada de tarefas relevantes ao plano comum. A extensão da imputação exige dolo compartilhado e contribuição relevante.","example":"Um agente ameaça e outro subtrai, sob acordo comum, no roubo.","claim":"A coautoria exige que todos executem literalmente o mesmo verbo típico.","truth":false,"comment":"A divisão funcional de tarefas pode caracterizar coautoria.","ref":"CP, art. 29; ROXIN, 2000"},{"title":"Autoria colateral e incerta","explain":"Autoria colateral ocorre quando agentes atuam paralelamente sem vínculo subjetivo. Se não é possível atribuir resultado a um deles, a prova e o in dubio pro reo delimitam responsabilidade; não se presume coautoria.","example":"Dois atiradores independentes disparam, mas perícia não individualiza projétil fatal.","claim":"A autoria colateral pressupõe acordo e atuação conjunta dos agentes.","truth":false,"comment":"A ausência de liame subjetivo é sua característica definidora.","ref":"CP, art. 29; CF, art. 5º, LVII"},{"title":"Multidão delinquente","explain":"Agitação coletiva não exclui necessidade de prova individual de contribuição e elemento subjetivo. O art. 65, III, e admite atenuante para influência de multidão em tumulto não provocada pelo agente.","example":"Em tumulto, participante adere conscientemente à prática de dano por integrantes do grupo.","claim":"Estar presente em uma multidão delinquente basta, sem prova de conduta, para condenação.","truth":false,"comment":"A responsabilização penal é pessoal; presença isolada não substitui prova de contribuição.","ref":"CP, art. 65, III, e; CF, art. 5º, LVII"}]},{"name":"Participação e limites","summary":"A participação pode ocorrer por induzimento, instigação ou auxílio, exigindo vinculação consciente ao fato principal e respeito à acessoriedade.","flow":"Conduta principal típica e ilícita + auxílio doloso → participação","concepts":[{"title":"Induzimento, instigação e auxílio","explain":"Induzir é fazer nascer ideia criminosa; instigar é reforçá-la; auxiliar é fornecer apoio material. A participação, em regra, exige dolo e conexão com fato principal.","example":"Convencer alguém que não havia considerado praticar furto é induzimento; fornecer ferramenta conscientemente pode ser auxílio.","claim":"Induzimento e instigação são sinônimos perfeitos.","truth":false,"comment":"O primeiro cria a decisão; o segundo a fortalece.","ref":"CP, arts. 29 e 31; GRECO, 2024"},{"title":"Acessoriedade da participação","explain":"A teoria da acessoriedade limitada, frequentemente adotada na doutrina, exige fato principal típico e ilícito, sem necessariamente exigir culpabilidade do autor principal para punir partícipe culpável.","example":"Adulto instiga criança inimputável a realizar conduta penalmente típica e ilícita: o enquadramento requer exame específico de autoria/participação.","claim":"Pela acessoriedade limitada, a culpabilidade do executor é sempre indispensável à punição do partícipe.","truth":false,"comment":"A teoria exige tipicidade e ilicitude do fato principal, não culpabilidade alheia.","ref":"BITENCOURT, 2024; CP, art. 29"},{"title":"Participação de menor importância","explain":"O art. 29, § 1º prevê possibilidade de redução de um sexto a um terço em participação secundária, avaliada concretamente. Não corresponde automaticamente a toda participação.","example":"Colaboração periférica e de pequena relevância em comparação à execução principal.","claim":"Todo partícipe recebe obrigatoriamente redução de um sexto a um terço.","truth":false,"comment":"A redução depende de qualificação concreta da menor importância.","ref":"CP, art. 29, § 1º"},{"title":"Cooperação dolosamente distinta","explain":"Quem quer participar de crime menos grave responde por esse crime, e a pena pode ser aumentada até metade se resultado mais grave era previsível, conforme § 2º do art. 29.","example":"A adere apenas a furto, mas B, fora do plano, pratica violência: analisa-se previsão e vínculo subjetivo.","claim":"O art. 29, § 2º obriga sempre a punição do concorrente pelo crime mais grave praticado por terceiro.","truth":false,"comment":"O dispositivo disciplina expressamente o desvio subjetivo.","ref":"CP, art. 29, § 2º"},{"title":"Circunstâncias e elementares","explain":"Circunstâncias e condições pessoais, em regra, não se comunicam entre concorrentes. Elementares do crime podem comunicar-se quando conhecidas pelo outro agente e relevantes à imputação.","example":"No peculato, a condição funcional do agente é elementar e pode repercutir no concorrente que a conhece.","claim":"Toda característica pessoal de um agente comunica-se automaticamente aos demais.","truth":false,"comment":"O art. 30 distingue circunstâncias pessoais e elementares do delito.","ref":"CP, art. 30"},{"title":"Participação impunível","explain":"O art. 31 determina, salvo disposição expressa contrária, que ajuste, determinação, instigação e auxílio não são puníveis se o crime não chega pelo menos a ser tentado. Isso não exclui crimes autônomos de preparação.","example":"Indivíduos combinam furto e não iniciam execução, sem cometer outro delito.","claim":"O mero ajuste punível como participação independe de qualquer tentativa de execução do crime principal.","truth":false,"comment":"O art. 31 exige ao menos tentativa, salvo disposição expressa em contrário.","ref":"CP, art. 31"},{"title":"Crimes próprios e de mão própria","explain":"Em crimes próprios, condição especial do autor pode ser elementar comunicável; delitos de mão própria exigem execução pessoal do núcleo, com restrições à coautoria, mas admitem participação conforme hipótese.","example":"Terceiro consciente auxilia funcionário público a desviar bem sob sua posse funcional.","claim":"Crimes próprios nunca admitem contribuição de pessoa sem a qualidade exigida pelo tipo.","truth":false,"comment":"O art. 30 e a dogmática admitem concurso em condições específicas.","ref":"CP, arts. 29–30"},{"title":"Concurso em crimes culposos e omissivos","explain":"A coautoria culposa é admitida por parcela relevante da doutrina para violação conjunta de dever de cuidado; participação dolosa em crime culposo é controvertida. Crimes omissivos exigem análise da posição de garante ou dever específico.","example":"Dois responsáveis assumem conjuntamente procedimento inseguro e produzem resultado culposo.","claim":"O concurso de pessoas em crimes culposos e omissivos não apresenta qualquer divergência dogmática.","truth":false,"comment":"Há distinções e debates sobre coautoria, participação e deveres de agir.","ref":"CP, arts. 13, § 2º, 18 e 29; BITENCOURT, 2024"},{"title":"Participação moral e material","explain":"Participação moral se manifesta principalmente por induzimento ou instigação; material, por auxílio relevante. A contribuição deve ser dolosa e vinculada ao delito principal, sem exigir necessariamente execução do verbo do tipo.","example":"Reforçar plano de assalto é instigação; fornecer conscientemente ferramenta é auxílio.","claim":"Somente auxílio material configura participação penal.","truth":false,"comment":"Induzimento e instigação são modalidades morais relevantes.","ref":"CP, art. 29; BITENCOURT, 2024"}]}]}],"references":["BRASIL. Constituição (1988). Constituição da República Federativa do Brasil de 1988. Brasília, DF: Presidência da República, 1988. Disponível em: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm. Acesso em: 19 nov. 2026.","BRASIL. Decreto-Lei nº 2.848, de 7 de dezembro de 1940. Código Penal. Brasília, DF: Presidência da República, 1940. Disponível em: https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm. Acesso em: 19 nov. 2026.","BRASIL. Decreto-Lei nº 3.688, de 3 de outubro de 1941. Lei das Contravenções Penais. Brasília, DF: Presidência da República, 1941. Disponível em: https://www.planalto.gov.br/ccivil_03/decreto-lei/del3688.htm. Acesso em: 19 nov. 2026.","BRASIL. Lei nº 8.069, de 13 de julho de 1990. Estatuto da Criança e do Adolescente. Brasília, DF: Presidência da República, 1990.","BRASIL. Lei nº 10.406, de 10 de janeiro de 2002. Código Civil. Brasília, DF: Presidência da República, 2002.","BRASIL. Superior Tribunal de Justiça. Informativo de Jurisprudência nº 590. Brasília, DF: STJ, 2016. Disponível em: https://scon.stj.jus.br/jurisprudencia/externo/informativo/?acao=pesquisarumaedicao&aplicacao=informativo&livre=0590.cod. Acesso em: 19 nov. 2026.","CONSELHO NACIONAL DE JUSTIÇA. Resolução nº 487, de 15 de fevereiro de 2023. Brasília, DF: CNJ, 2023.","BELING, Ernst von. Die Lehre vom Verbrechen. Tübingen: Mohr, 1906.","FRANK, Reinhard. Über den Aufbau des Schuldbegriffs. Gießen: Töpelmann, 1907.","MAYER, Max Ernst. Der allgemeine Teil des deutschen Strafrechts. Heidelberg: Winter, 1915.","MEZGER, Edmund. Strafrecht: ein Lehrbuch. München: Duncker & Humblot, 1931.","ROXIN, Claus. Autoría y dominio del hecho en derecho penal. 7. ed. Madrid: Marcial Pons, 2000.","WELZEL, Hans. Studien zum System des Strafrechts. Zeitschrift für die gesamte Strafrechtswissenschaft, v. 58, 1939.","ZAFFARONI, Eugenio Raúl; PIERANGELI, José Henrique. Manual de direito penal brasileiro: parte geral. São Paulo: Revista dos Tribunais, 2011.","BITENCOURT, Cezar Roberto. Tratado de direito penal: parte geral. São Paulo: SaraivaJur, 2024. (Referência geral; conferir edição utilizada para paginação de citações diretas).","GRECO, Rogério. Curso de direito penal: parte geral. Rio de Janeiro: Impetus, 2024. (Referência geral; conferir edição utilizada para paginação de citações diretas).","NUCCI, Guilherme de Souza. Manual de direito penal. Rio de Janeiro: Forense, 2024. (Referência geral; conferir edição utilizada para paginação de citações diretas).","MIRABETE, Julio Fabbrini; FABBRINI, Renato N. Manual de direito penal: parte geral. São Paulo: Atlas, 2024. (Referência geral; conferir edição utilizada para paginação de citações diretas)."]};const M=DATA.modules;const KEY='penal_minicurso_v2';let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const answers=stored.answers||{},fixed=stored.fixed||{};let route={m:-1,t:-1};const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,fixed}))}catch(e){}};function key(m,t,i){return `${m}:${t}:${i}`};function all(){return M.flatMap((m,mi)=>m.topics.flatMap((t,ti)=>t.concepts.map((c,i)=>key(mi,ti,i))))};function grade(mi,ti){let tt=M[mi].topics[ti],ans=tt.concepts.map((_,i)=>answers[key(mi,ti,i)]);return{done:ans.filter(x=>x!==undefined).length,total:ans.length,correct:ans.filter((a,i)=>a===tt.concepts[i].truth).length}};function overall(){let a=all(),done=a.filter(k=>answers[k]!==undefined).length;return{done,total:a.length,pct:Math.round(100*done/a.length)}}
function nav(){let o=overall();document.getElementById('nav').innerHTML=`<div class="sub">Simulados respondidos: ${o.done}/${o.total}</div><div class="progress"><div class="bar" style="width:${o.pct}%"></div></div>`+M.map((m,mi)=>`<div class="navmod"><button class="mod-btn ${route.m===mi?'active':''}" onclick="go(${mi},-1)"><span>${m.icon} ${esc(m.name)}</span><span>${m.topics.length}</span></button>${m.topics.map((t,ti)=>{let g=grade(mi,ti);return `<button class="topic-btn ${route.m===mi&&route.t===ti?'active':''}" onclick="go(${mi},${ti})"><span>${esc(t.name)}</span><span>${g.done}/${g.total}</span></button>`}).join('')}</div>`).join('')+`<button class="topic-btn ${route.m===-4?'active':''}" onclick="go(-4,-4)">✦ Questões bônus · NotebookLM</button><button class="topic-btn" onclick="go(-2,-2)">📚 Referências e metodologia</button><button class="topic-btn" onclick="go(-3,-3)">📊 Meu desempenho</button>`}
function go(mi,ti){route={m:mi,t:ti};nav();let area=document.getElementById('main');if(mi===-1)area.innerHTML=home();else if(mi===-2)area.innerHTML=refs();else if(mi===-3)area.innerHTML=stats();else if(mi===-4)area.innerHTML=bonusView();else if(ti===-1)area.innerHTML=moduleView(mi);else area.innerHTML=topicView(mi,ti);window.scrollTo({top:0,behavior:'instant'});document.getElementById('side').classList.remove('open')};function home(){let o=overall();return `<section class="hero"><span class="eyebrow">MINICURSO INTERATIVO · ESTUDO AUTÔNOMO</span><h1>Teoria Geral do Crime</h1><p class="lead">Ilicitude, culpabilidade, iter criminis e concurso de pessoas. Cada assunto apresenta síntese, desenvolvimento conceitual, linha visual do raciocínio, fixações com resposta revelável e simulado final com correção imediata.</p><div class="meta"><span class="chip">${M.length} eixos</span><span class="chip">${M.reduce((a,m)=>a+m.topics.length,0)} assuntos</span><span class="chip">${o.total} conceitos e questões</span><span class="chip">Curso e vídeos offline com arquivos locais</span></div></section><section class="panel"><div class="sticky-top"><h2>Seu percurso</h2><b>${o.pct}%</b></div><div class="progress"><div class="bar" style="width:${o.pct}%"></div></div><p class="sub">${o.done} de ${o.total} questões de simulado respondidas · Progresso preservado neste navegador, quando o armazenamento local estiver disponível.</p></section><h2>Escolha um eixo</h2><div class="overview">${M.map((m,i)=>`<button onclick="go(${i},-1)"><span class="eyebrow">EIXO 0${i+1}</span><b>${m.icon} ${esc(m.name)}</b><span class="sub">${m.topics.length} assuntos · ${m.topics.reduce((a,t)=>a+t.concepts.length,0)} conceitos</span><p>${esc(m.summary)}</p></button>`).join('')}</div><section class="panel"><span class="eyebrow">PRÁTICA ADICIONAL</span><h2>Simulado bônus · 20 questões</h2><p class="muted">Questões objetivas complementares com comentários imediatos, independentes dos simulados de cada assunto.</p><button class="primary" onclick="go(-4,-4)">Abrir questões bônus →</button></section><div class="notice">Método: as fixações são perguntas abertas com resposta revelável; os simulados são exclusivamente ao final de cada assunto, com 1 julgamento certo/errado por conceito. Há distinção expressa entre lei, doutrina e jurisprudência.</div>`}
function moduleView(mi){let m=M[mi];return `<div class="hero"><span class="eyebrow">EIXO ${mi+1} / 4</span><h1>${m.icon} ${esc(m.name)}</h1><p class="lead">${esc(m.summary)}</p><div class="meta"><span class="chip">${m.topics.length} assuntos</span><span class="chip">${m.topics.reduce((a,t)=>a+t.concepts.length,0)} conceitos e questões</span></div></div>${videoCard(mi,true)}<h2>Assuntos deste eixo</h2><div class="overview">${m.topics.map((t,ti)=>{let g=grade(mi,ti);return `<button onclick="go(${mi},${ti})"><span class="eyebrow">ASSUNTO ${ti+1}</span><b>${esc(t.name)}</b><p>${esc(t.summary)}</p><span class="sub">Simulado: ${g.done}/${g.total} respondidas</span></button>`}).join('')}</div><div class="bottomnav"><button class="secondary" onclick="go(-1,-1)">← Visão geral</button><button class="primary" onclick="go(${mi},0)">Iniciar eixo →</button></div>`}
function topicView(mi,ti){let t=M[mi].topics[ti],g=grade(mi,ti),steps=t.flow.split('→').map(s=>s.trim()).filter(Boolean);let current=M[mi];return `<div class="sticky-top"><button class="secondary" onclick="go(${mi},-1)">← ${esc(current.name)}</button><span class="tag">ASSUNTO ${ti+1}/${current.topics.length}</span></div><section class="hero"><span class="eyebrow">${current.icon} ${esc(current.name)}</span><h1>${esc(t.name)}</h1><p class="lead">${esc(t.summary)}</p><div class="meta"><span class="chip">${t.concepts.length} conceitos</span><span class="chip">${t.concepts.length} questões avaliativas</span></div></section>${videoCard(mi,false)}<section class="panel"><span class="eyebrow">02 · SÍNTESE DO ASSUNTO</span><h2>Ideia central</h2><p>${esc(t.summary)}</p><div class="pipeline">${steps.map((s,i)=>`${i?'<span class="arr">→</span>':''}<div class="step">${esc(s)}</div>`).join('')}</div><p class="small muted">Fluxograma conceitual animado. As etapas representam uma sequência lógica, não uma presunção jurídica irreversível.</p></section><section class="panel"><span class="eyebrow">03 · EXPLICAÇÃO CONCEITUAL E FIXAÇÃO</span><h2>Entenda cada conceito</h2><p class="muted">As perguntas em destaque integram a explicação. Abra a resposta imediatamente após formular sua hipótese. Elas não contam como questões do simulado.</p>${t.concepts.map((c,i)=>conceptView(c,mi,ti,i)).join('')}</section><section class="panel" id="sim"><span class="eyebrow">04 · SIMULADO DO ASSUNTO</span><div class="sim-head"><div><h2>Questões de certo ou errado</h2><p class="muted">Uma questão por conceito. Resposta e comentário automáticos após selecionar.</p></div><div><strong id="score">${g.correct}/${g.done}</strong><div class="sub" id="count">${g.done}/${g.total} respondidas</div></div></div><div class="progress"><div class="bar" id="topicbar" style="width:${100*g.done/g.total}%"></div></div>${t.concepts.map((c,i)=>questionView(c,mi,ti,i)).join('')}<div class="simple"><button class="secondary" onclick="resetTopic(${mi},${ti})">Refazer simulado deste assunto</button><button class="secondary" onclick="window.print()">Imprimir página</button></div></section><div class="bottomnav"><button class="secondary" onclick="${ti>0?`go(${mi},${ti-1})`:mi>0?`go(${mi-1},-1)`:'go(-1,-1)'}">← Anterior</button><button class="primary" onclick="${ti+1<current.topics.length?`go(${mi},${ti+1})`:mi+1<M.length?`go(${mi+1},-1)`:'go(-4,-4)'}">Próximo →</button></div>`}
function conceptView(c,mi,ti,i){let k=key(mi,ti,i);return `<article class="concept"><div class="count">CONCEITO ${String(i+1).padStart(2,'0')}</div><h3>${esc(c.title)}</h3><p>${esc(c.explain)}</p><div class="example"><b>Exemplo aplicado</b><div>${esc(c.example)}</div></div><div class="fix"><div class="fix-head">✦ Fixação durante a explicação · não é simulado</div><p><strong>Qual é a distinção ou o requisito decisivo em “${esc(c.title)}”?</strong></p><button id="fxbtn-${mi}-${ti}-${i}" onclick="toggleFix(${mi},${ti},${i})">${fixed[k]?'Ocultar resposta':'Revelar resposta'}</button><div class="answer ${fixed[k]?'':'hidden'}" id="fx-${mi}-${ti}-${i}"><b>Resposta comentada</b><p>${esc(c.comment)}</p></div></div><div class="ref">Fundamento / atribuição: ${esc(c.ref)}.</div></article>`}
function toggleFix(m,t,i){let k=key(m,t,i);fixed[k]=!fixed[k];save();document.getElementById(`fx-${m}-${t}-${i}`).classList.toggle('hidden',!fixed[k]);document.getElementById(`fxbtn-${m}-${t}-${i}`).textContent=fixed[k]?'Ocultar resposta':'Revelar resposta'}
function questionView(c,m,t,i){let k=key(m,t,i),v=answers[k],done=v!==undefined,good=done&&v===c.truth;return `<article class="quest" id="q-${m}-${t}-${i}"><div class="qnum">QUESTÃO ${String(i+1).padStart(2,'0')} · ${esc(c.title)}</div><p><strong>${esc(c.claim)}</strong></p><div class="choices"><button class="choice ${done?(c.truth===true?'correct':v===true?'wrong':''):''}" ${done?'disabled':''} onclick="answer(${m},${t},${i},true)">Certo</button><button class="choice ${done?(c.truth===false?'correct':v===false?'wrong':''):''}" ${done?'disabled':''} onclick="answer(${m},${t},${i},false)">Errado</button></div>${done?`<div class="feedback ${good?'good':'bad'}"><b>${good?'✓ Resposta correta':'✕ Resposta incorreta'} · Gabarito: ${c.truth?'CERTO':'ERRADO'}</b><div>${esc(c.comment)}</div><div class="ref">${esc(c.ref)}</div></div>`:''}</article>`}
function answer(m,t,i,v){let k=key(m,t,i);if(answers[k]!==undefined)return;answers[k]=v;save();document.getElementById(`q-${m}-${t}-${i}`).outerHTML=questionView(M[m].topics[t].concepts[i],m,t,i);let g=grade(m,t);document.getElementById('score').textContent=`${g.correct}/${g.done}`;document.getElementById('count').textContent=`${g.done}/${g.total} respondidas`;document.getElementById('topicbar').style.width=`${100*g.done/g.total}%`;nav();if(g.done===g.total){let el=document.getElementById('count');el.textContent+=` · ${Math.round(100*g.correct/g.total)}% de acertos`}}
function resetTopic(m,t){if(!confirm('Apagar apenas as respostas deste simulado para refazê-lo?'))return;M[m].topics[t].concepts.forEach((_,i)=>delete answers[key(m,t,i)]);save();go(m,t)}function refs(){return `<div class="hero"><span class="eyebrow">BASE NORMATIVA E BIBLIOGRÁFICA</span><h1>Referências e critérios</h1><p class="lead">As explicações utilizam paráfrases autorais com atribuição autor-data/legislação e não reproduzem extensos textos doutrinários. A redação de citações diretas dependeria de edição e página rigorosamente verificadas.</p></div><div class="panel"><h2>Critérios de precisão</h2><p><b>Legislação:</b> regras identificadas por artigos do Código Penal e legislação correlata. <b>Doutrina:</b> escolas e autores identificados em cada conceito. <b>Jurisprudência:</b> súmulas e informativos explicitados quando utilizados.</p><p>Expressões como “adotada” designam a orientação legal ou doutrinária prevalente no contexto indicado, não uma escolha expressa do legislador quando ele não nomeia a teoria. Divergências relevantes são destacadas no próprio conceito.</p><p class="notice">Bibliografia apresentada em formato ABNT (NBR 6023), com registros de obras gerais identificadas de modo indicativo; confirme edição e dados catalográficos do exemplar consultado antes de utilizar em trabalho acadêmico formal. Não há citações diretas doutrinárias sem conferência de página.</p></div><div class="panel refs"><h2>Referências</h2>${DATA.references.map(r=>`<p>${esc(r)}</p>`).join('')}</div>`}
